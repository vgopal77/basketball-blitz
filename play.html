<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Basketball Blitz</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W=1280, H=720;
const c=document.getElementById('c'), ctx=c.getContext('2d');
c.width=W; c.height=H;
function resize(){ const s=Math.min(innerWidth/W,innerHeight/H); c.style.width=W*s+'px'; c.style.height=H*s+'px'; }
window.addEventListener('resize',resize); resize();

const TEAMS={
  bulls:   {name:'Chicago Bulls',        abbr:'CHI',player:'M. Jordan',   primary:[206,17,65], secondary:[255,255,255],number:'23',type:'Power',atk:22,spd:5.0},
  lakers:  {name:'Los Angeles Lakers',   abbr:'LAL',player:'LeBron James',primary:[85,37,130], secondary:[253,185,39], number:'23',type:'Power',atk:20,spd:5.2},
  warriors:{name:'Golden State Warriors',abbr:'GSW',player:'S. Curry',    primary:[29,66,138], secondary:[255,199,44], number:'30',type:'Speed',atk:14,spd:7.0},
  celtics: {name:'Boston Celtics',       abbr:'BOS',player:'J. Tatum',    primary:[0,122,51],  secondary:[255,255,255],number:'0', type:'Power',atk:21,spd:5.2},
  heat:    {name:'Miami Heat',           abbr:'MIA',player:'J. Butler',   primary:[152,0,46],  secondary:[255,162,0],  number:'22',type:'Speed',atk:15,spd:6.8},
  nets:    {name:'Brooklyn Nets',        abbr:'BKN',player:'K. Durant',   primary:[25,25,25],  secondary:[255,255,255],number:'7', type:'Speed',atk:17,spd:6.5},
};
const ORDER=['bulls','lakers','warriors','celtics','heat','nets'];

const HUD_H=60;
const CROWD_T=HUD_H, CROWD_B=300;
const FLOOR_T=300, FLOOR_B=H;
const PLAYER_Y=530;
const COURT_L=55, COURT_R=1225;
const MAX_HP=260, ATK_CD=24, DASH_CD=100, ATK_RNG=95, DASH_D=150;

const rgb=(r,g,b,a=1)=>`rgba(${r},${g},${b},${a})`;
const clamp=(v,l,h)=>Math.max(l,Math.min(h,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const dist2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

let state='menu', teamSel=0;
let player, opp, winner='', lastAct='', lastActT=0, tick=0;
const keys={};
document.addEventListener('keydown',e=>{keys[e.code]=true;e.preventDefault();});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
c.addEventListener('click',()=>{
  if(state==='menu')state='team_select';
  else if(state==='game_over'){player=opp=null;winner='';state='menu';}
});

// ── PRE-RENDER STATIC ARENA ───────────────────────────────────────────────
const buf=document.createElement('canvas');buf.width=W;buf.height=H;
const bc=buf.getContext('2d');
(function buildArena(){
  // Ceiling
  const cg=bc.createLinearGradient(0,0,0,CROWD_B);
  cg.addColorStop(0,'#010108');cg.addColorStop(1,'#0b0518');
  bc.fillStyle=cg;bc.fillRect(0,0,W,CROWD_B+40);

  // Ceiling spotlight beams
  bc.save();bc.globalAlpha=.08;
  for(let i=0;i<8;i++){
    const lx=80+i*165;
    const lg=bc.createLinearGradient(lx,0,lx,CROWD_B);
    lg.addColorStop(0,'rgba(255,230,150,1)');lg.addColorStop(1,'rgba(255,230,150,0)');
    bc.fillStyle=lg;bc.beginPath();bc.moveTo(lx,0);bc.lineTo(lx-80,CROWD_B);bc.lineTo(lx+80,CROWD_B);bc.closePath();bc.fill();
  }
  bc.restore();

  // Upper bleachers
  const sg=bc.createLinearGradient(0,CROWD_T,0,CROWD_B);
  sg.addColorStop(0,'#100c1c');sg.addColorStop(1,'#1a1226');
  bc.fillStyle=sg;bc.fillRect(0,CROWD_T,W,CROWD_B-CROWD_T);

  // Crowd rows
  const shirts=['#cc2020','#2020cc','#208020','#c8a800','#c85020','#6820cc','#20c8c8','#c820c8'];
  const skins=['#c89060','#a06030','#d4a870','#805028','#deb888'];
  for(let row=0;row<7;row++){
    const baseY=CROWD_T+18+row*36;
    const step=16+row*2;
    for(let x=10;x<W-10;x+=step){
      const jx=x+Math.sin(x*.5+row*1.4)*3;
      const jy=baseY+Math.sin(x*.7+row)*3;
      const sz=Math.max(6,11-row);
      bc.fillStyle=shirts[(Math.floor(x*.3)+row*7)%shirts.length];
      bc.beginPath();bc.ellipse(jx,jy,sz*.5,sz*.7,0,0,Math.PI*2);bc.fill();
      bc.fillStyle=skins[(Math.floor(x*.2)+row*5)%skins.length];
      bc.beginPath();bc.arc(jx,jy-sz*.7,sz*.3,0,Math.PI*2);bc.fill();
    }
  }

  // Scoreboard suspended from ceiling
  const sbW=270,sbH=75,sbX=W/2-135,sbY=CROWD_T+4;
  bc.strokeStyle='#445';bc.lineWidth=2.5;
  [[sbX+48,0],[sbX+sbW-48,0]].forEach(([lx])=>{bc.beginPath();bc.moveTo(lx,0);bc.lineTo(lx,sbY);bc.stroke();});
  bc.fillStyle='#060415';bc.fillRect(sbX,sbY,sbW,sbH);
  bc.strokeStyle='rgba(255,215,0,.55)';bc.lineWidth=2;bc.strokeRect(sbX,sbY,sbW,sbH);
  bc.fillStyle='#bb0020';bc.fillRect(sbX,sbY,sbW,24);
  bc.fillStyle='#fff';bc.font='bold 14px Arial';bc.textAlign='center';
  bc.fillText('NBA  BASKETBALL  BLITZ',W/2,sbY+17);
  bc.fillStyle='#ffd700';bc.font='bold 32px Arial';bc.fillText('00 : 00',W/2,sbY+62);

  // Court floor – light maple perspective trapezoid
  const fg=bc.createLinearGradient(0,FLOOR_T,0,FLOOR_B);
  fg.addColorStop(0,'#b89852');fg.addColorStop(.3,'#d4b468');fg.addColorStop(.6,'#e0c278');fg.addColorStop(1,'#c8a85a');
  bc.fillStyle=fg;
  bc.beginPath();bc.moveTo(160,FLOOR_T);bc.lineTo(1120,FLOOR_T);bc.lineTo(W,FLOOR_B);bc.lineTo(0,FLOOR_B);bc.closePath();bc.fill();

  // Wood planks
  bc.save();bc.globalAlpha=.05;
  for(let i=0;i<40;i++){
    const t=i/40,y=lerp(FLOOR_T,FLOOR_B,t);
    const xl=lerp(160,0,t),xr=lerp(1120,W,t);
    bc.fillStyle=i%2===0?'#000':'#fff';bc.fillRect(xl,y,xr-xl,(FLOOR_B-FLOOR_T)/40*.5);
  }
  bc.restore();

  // Court line helpers
  function proj(wx,wy){
    const xl=lerp(160,0,wy),xr=lerp(1120,W,wy);
    return{x:lerp(xl,xr,wx),y:lerp(FLOOR_T,FLOOR_B,wy)};
  }
  function line(x1,y1,x2,y2){
    const a=proj(x1,y1),b=proj(x2,y2);
    bc.beginPath();bc.moveTo(a.x,a.y);bc.lineTo(b.x,b.y);bc.stroke();
  }
  function paintZone(x1,x2,y1,y2,col){
    const tl=proj(x1,y1),tr=proj(x2,y1),bl=proj(x1,y2),br=proj(x2,y2);
    bc.fillStyle=col;bc.beginPath();bc.moveTo(tl.x,tl.y);bc.lineTo(tr.x,tr.y);bc.lineTo(br.x,br.y);bc.lineTo(bl.x,bl.y);bc.closePath();bc.fill();
    bc.beginPath();bc.moveTo(tl.x,tl.y);bc.lineTo(tr.x,tr.y);bc.lineTo(br.x,br.y);bc.lineTo(bl.x,bl.y);bc.closePath();bc.stroke();
  }
  function arc(cx,cy,rx,ry,sa,ea){
    const N=60;bc.beginPath();
    for(let i=0;i<=N;i++){
      const ang=sa+(ea-sa)*i/N,p=proj(cx+Math.cos(ang)*rx,cy+Math.sin(ang)*ry);
      i===0?bc.moveTo(p.x,p.y):bc.lineTo(p.x,p.y);
    }bc.stroke();
  }

  // Paint zones
  bc.fillStyle='rgba(0,0,0,0)';
  paintZone(0,.16,.15,.85,'rgba(198,16,44,.75)');
  paintZone(.84,1,.15,.85,'rgba(198,16,44,.75)');

  // Court lines
  bc.strokeStyle='rgba(255,255,255,.9)';bc.lineWidth=2.5;
  // Outline
  bc.beginPath();bc.moveTo(160,FLOOR_T);bc.lineTo(1120,FLOOR_T);bc.lineTo(W,FLOOR_B);bc.lineTo(0,FLOOR_B);bc.closePath();bc.stroke();
  // Center
  line(.5,0,.5,1);
  // Free throw
  line(.16,.15,.16,.85);line(.84,.15,.84,.85);
  // 3pt arcs
  bc.lineWidth=2.8;
  arc(.16,.5,.16,.48,-Math.PI/2,Math.PI/2);
  arc(.84,.5,.16,.48,Math.PI/2,Math.PI*1.5);
  // Center circle
  arc(.5,.5,.09,.26,0,Math.PI*2);

  // Hoops
  (function hoop(side){
    const wx=side==='l'?.035:.965,wy=.5;
    const p=proj(wx,wy),flip=side==='r';
    const s=flip?-1:1;
    bc.fillStyle='#58586a';bc.fillRect(p.x-4,p.y-88,8,88);
    bc.fillStyle='rgba(195,220,255,.88)';bc.fillRect(p.x-5,p.y-80,10,55);
    bc.strokeStyle='rgba(255,255,255,.85)';bc.lineWidth=2;bc.strokeRect(p.x-5,p.y-80,10,55);
    bc.strokeStyle='#ff4444';bc.lineWidth=1.5;bc.strokeRect(p.x-3,p.y-62,6,28);
    const rx=p.x+s*34;
    bc.strokeStyle='#888';bc.lineWidth=3;bc.beginPath();bc.moveTo(p.x,p.y-48);bc.lineTo(rx,p.y-48);bc.stroke();
    bc.strokeStyle='#e86810';bc.lineWidth=4.5;bc.beginPath();bc.ellipse(rx,p.y-48,22,6,0,0,Math.PI*2);bc.stroke();
    bc.strokeStyle='rgba(240,240,240,.6)';bc.lineWidth=1;
    for(let i=0;i<8;i++){const a=i/8*Math.PI*2;bc.beginPath();bc.moveTo(rx+Math.cos(a)*22,p.y-48+Math.sin(a)*6);bc.lineTo(rx+Math.cos(a)*14,p.y-22);bc.stroke();}
    bc.beginPath();bc.ellipse(rx,p.y-28,17,4.5,0,0,Math.PI*2);bc.stroke();
    bc.beginPath();bc.ellipse(rx,p.y-18,11,3,0,0,Math.PI*2);bc.stroke();
  })('l');
  (function hoop(side){
    const wx=side==='l'?.035:.965,wy=.5;
    const p=proj(wx,wy),flip=side==='r';
    const s=flip?-1:1;
    bc.fillStyle='#58586a';bc.fillRect(p.x-4,p.y-88,8,88);
    bc.fillStyle='rgba(195,220,255,.88)';bc.fillRect(p.x-5,p.y-80,10,55);
    bc.strokeStyle='rgba(255,255,255,.85)';bc.lineWidth=2;bc.strokeRect(p.x-5,p.y-80,10,55);
    bc.strokeStyle='#ff4444';bc.lineWidth=1.5;bc.strokeRect(p.x-3,p.y-62,6,28);
    const rx=p.x+s*34;
    bc.strokeStyle='#888';bc.lineWidth=3;bc.beginPath();bc.moveTo(p.x,p.y-48);bc.lineTo(rx,p.y-48);bc.stroke();
    bc.strokeStyle='#e86810';bc.lineWidth=4.5;bc.beginPath();bc.ellipse(rx,p.y-48,22,6,0,0,Math.PI*2);bc.stroke();
    bc.strokeStyle='rgba(240,240,240,.6)';bc.lineWidth=1;
    for(let i=0;i<8;i++){const a=i/8*Math.PI*2;bc.beginPath();bc.moveTo(rx+Math.cos(a)*22,p.y-48+Math.sin(a)*6);bc.lineTo(rx+Math.cos(a)*14,p.y-22);bc.stroke();}
    bc.beginPath();bc.ellipse(rx,p.y-28,17,4.5,0,0,Math.PI*2);bc.stroke();
    bc.beginPath();bc.ellipse(rx,p.y-18,11,3,0,0,Math.PI*2);bc.stroke();
  })('r');
})();

// ── HUMAN SPRITE (side-view, upright) ─────────────────────────────────────
function drawHuman(x,y,td,facing,flash,supAct,wp){
  const[pr,pg,pb]=td.primary,[sr,sg,sb]=td.secondary;
  const[jr,jg,jb]=flash?[255,60,60]:[pr,pg,pb];
  const TH=118,HR=14;
  const footY=y,headY=y-TH;
  const shouldY=headY+HR*2+4;
  const waistY=shouldY+32,kneeY=waistY+22;
  const SW=22,AH=28,AW=10;
  const ws=Math.sin(wp*Math.PI*2);

  // Super aura
  if(supAct>0){
    ctx.save();ctx.globalAlpha=.2+.1*Math.sin(tick*.12);
    const ag=ctx.createRadialGradient(x,y-TH/2,5,x,y-TH/2,TH*.7);
    ag.addColorStop(0,'rgba(0,255,180,.6)');ag.addColorStop(1,'rgba(0,255,180,0)');
    ctx.fillStyle=ag;ctx.fillRect(x-TH*.8,y-TH*1.15,TH*1.6,TH*1.3);ctx.restore();
  }

  // Shadow
  ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(x,footY+5,SW*1.6,6,0,0,Math.PI*2);ctx.fill();ctx.restore();

  // Back arm
  const baX=facing>0?x-SW*.9:x+SW*.9;
  ctx.save();ctx.translate(baX,shouldY+5);ctx.rotate(facing>0?.45+ws*.2:-.45-ws*.2);
  ctx.fillStyle=rgb(jr,jg,jb);ctx.fillRect(-AW/2,0,AW,AH*.45);
  ctx.fillStyle='#b07838';ctx.fillRect(-AW/2+1,AH*.45,AW-2,AH*.55);ctx.restore();

  // Legs
  const lo=facing>0?ws*9:-ws*9;
  // Left
  ctx.fillStyle=rgb(Math.max(0,jr-70),Math.max(0,jg-70),Math.max(0,jb-70));
  ctx.fillRect(x-SW*.45,waistY+lo,15,22);
  ctx.fillStyle='#b07838';ctx.fillRect(x-SW*.45,kneeY+lo,13,24);
  ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(x-SW*.4+facing*3,footY+lo+3,15,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=rgb(sr,sg,sb);ctx.fillRect(x-SW*.4-14,footY+lo,28,2);
  // Right
  ctx.fillStyle=rgb(Math.max(0,jr-70),Math.max(0,jg-70),Math.max(0,jb-70));
  ctx.fillRect(x+SW*.3,waistY-lo+5,15,22);
  ctx.fillStyle='#b07838';ctx.fillRect(x+SW*.3,kneeY-lo+5,13,24);
  ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(x+SW*.35+facing*3,footY-lo+5,15,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=rgb(sr,sg,sb);ctx.fillRect(x+SW*.35-14,footY-lo+3,28,2);

  // Jersey body
  ctx.fillStyle=rgb(jr,jg,jb);
  ctx.beginPath();ctx.moveTo(x-SW*1.2,shouldY);ctx.lineTo(x+SW*1.2,shouldY);
  ctx.lineTo(x+SW*.85,waistY);ctx.lineTo(x-SW*.85,waistY);ctx.closePath();ctx.fill();
  // Collar
  ctx.fillStyle=rgb(sr,sg,sb);ctx.fillRect(x-SW*.85,shouldY+2,SW*1.7,3);
  // Number
  ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillText(td.number,x+1,shouldY+17);
  ctx.fillStyle=rgb(sr,sg,sb);ctx.fillText(td.number,x,shouldY+17);ctx.textBaseline='alphabetic';
  // Outline
  ctx.strokeStyle=flash?'#fff':rgb(sr,sg,sb,0.7);ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(x-SW*1.2,shouldY);ctx.lineTo(x+SW*1.2,shouldY);
  ctx.lineTo(x+SW*.85,waistY);ctx.lineTo(x-SW*.85,waistY);ctx.closePath();ctx.stroke();

  // Front arm
  const faX=facing>0?x+SW*.9:x-SW*.9;
  ctx.save();ctx.translate(faX,shouldY+5);ctx.rotate(facing>0?-.15-ws*.2:.15+ws*.2);
  ctx.fillStyle=rgb(jr,jg,jb);ctx.fillRect(-AW/2,0,AW,AH*.45);
  ctx.fillStyle='#b07838';ctx.fillRect(-AW/2+1,AH*.45,AW-2,AH*.55);ctx.restore();

  // Head
  ctx.fillStyle='#b07838';ctx.beginPath();ctx.arc(x,headY+HR,HR,0,Math.PI*2);ctx.fill();
  // Hair
  ctx.fillStyle='#180a00';ctx.beginPath();ctx.arc(x,headY+HR,HR,Math.PI,Math.PI*2);ctx.fill();
  // Eye
  const eyeX=facing>0?x+HR*.45:x-HR*.45;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(eyeX,headY+HR*.9,3.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a0800';ctx.beginPath();ctx.arc(eyeX+facing*.7,headY+HR*.9,1.5,0,Math.PI*2);ctx.fill();
  // Headband
  ctx.strokeStyle=rgb(sr,sg,sb);ctx.lineWidth=3.5;
  ctx.beginPath();ctx.arc(x,headY+HR,HR+1,Math.PI,Math.PI*2);ctx.stroke();
  // Cap body
  ctx.fillStyle=rgb(Math.max(0,pr-45),Math.max(0,pg-45),Math.max(0,pb-45));
  ctx.beginPath();ctx.ellipse(x,headY+HR*.42,HR*1.12,HR*.52,0,Math.PI,Math.PI*2);ctx.fill();
  // Brim
  ctx.fillStyle=rgb(Math.max(0,pr-70),Math.max(0,pg-70),Math.max(0,pb-70));
  ctx.beginPath();ctx.ellipse(x+facing*(HR+8),headY+HR*.92,HR*.52,3.5,facing>.0?.2:-.2,0,Math.PI*2);ctx.fill();
}

// ── FIGHTER CLASS ─────────────────────────────────────────────────────────
class Fighter{
  constructor(x,key,ai=false){
    this.x=x;this.y=PLAYER_Y;this.teamKey=key;this.td=TEAMS[key];this.ai=ai;
    this.hp=MAX_HP;this.maxHp=MAX_HP;this.sup=0;
    this.atkCd=0;this.dashCd=0;this.supAct=0;
    this.dmgFl=0;this.atkFl=0;this.trail=[];
    this.facing=ai?-1:1;this.aiDashT=0;
    this.spd=this.td.spd;this.dmg=this.td.atk;
    this.walkPhase=0;this.moving=false;
  }
  get dead(){return this.hp<=0;}
  move(dx){
    if(dx)this.facing=dx>0?1:-1;
    this.moving=!!dx;
    this.x=clamp(this.x+dx*this.spd,COURT_L+30,COURT_R-30);
    if(this.moving)this.walkPhase=(this.walkPhase+.07)%1;
  }
  dash(){
    if(this.dashCd>0)return;this.dashCd=DASH_CD;
    const nx=clamp(this.x+this.facing*DASH_D,COURT_L+30,COURT_R-30);
    for(let i=0;i<6;i++)this.trail.push({x:lerp(this.x,nx,i/6),y:this.y,a:.55,td:this.td});
    this.x=nx;
  }
  attack(t){
    if(this.atkCd>0)return false;this.atkCd=ATK_CD;this.atkFl=14;
    if(dist2(this,t)<=ATK_RNG){t.hp=Math.max(0,t.hp-this.dmg);t.dmgFl=14;this.sup=Math.min(100,this.sup+13);return true;}
    return false;
  }
  useSuper(t){
    if(this.sup<100)return;this.sup=0;
    if(this.td.type==='Power'){if(dist2(this,t)<=ATK_RNG*2.8){t.hp=Math.max(0,t.hp-65);t.dmgFl=22;}}
    else this.supAct=300;
  }
  updateAI(t){
    const d=dist2(this,t),dx=this.x<t.x?1:-1;
    if(d>ATK_RNG*.8)this.move(dx);else this.moving=false;
    if(d<=ATK_RNG){this.attack(t);if(this.sup>=100)this.useSuper(t);}
    if(--this.aiDashT<=0&&d>ATK_RNG*1.5&&Math.random()<.015){this.facing=dx;this.dash();this.aiDashT=160;}
  }
  tick(){
    ['atkCd','dashCd','dmgFl','atkFl','supAct'].forEach(k=>{if(this[k]>0)this[k]--;});
    this.trail=this.trail.filter(t=>{t.a-=.07;return t.a>0;});
  }
  draw(){
    // Trail
    for(const t of this.trail){
      const[pr,pg,pb]=t.td.primary;
      ctx.save();ctx.globalAlpha=t.a*.4;ctx.fillStyle=rgb(pr,pg,pb);
      ctx.beginPath();ctx.ellipse(t.x,t.y-58,19,56,0,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    // Attack flash ring
    if(this.atkFl>0){
      ctx.save();ctx.globalAlpha=this.atkFl/14;ctx.strokeStyle='#ffe040';ctx.lineWidth=3.5;
      ctx.beginPath();ctx.arc(this.x,this.y-58,50,0,Math.PI*2);ctx.stroke();ctx.restore();
    }
    drawHuman(this.x,this.y,this.td,this.facing,this.dmgFl>0,this.supAct,this.walkPhase);
    // Name tag
    const[sr,sg,sb]=this.td.secondary;
    ctx.font='bold 12px Arial';ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,0,.82)';ctx.fillRect(this.x-44,this.y-148,88,18);
    ctx.fillStyle=rgb(sr,sg,sb);ctx.fillText('★ '+this.td.player,this.x,this.y-134);
    // HP bar under name
    const bw=76,bh=7,bx=this.x-38,by=this.y-132;
    const ratio=this.hp/this.maxHp;
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(bx-1,by-1,bw+2,bh+2);
    ctx.fillStyle=ratio>.3?'#20e040':'#e02020';ctx.fillRect(bx,by,bw*ratio,bh);
  }
}

// ── LOGO ──────────────────────────────────────────────────────────────────
function logo(x,y,r,td){
  const[pr,pg,pb]=td.primary,[sr,sg,sb]=td.secondary;
  ctx.fillStyle=rgb(pr,pg,pb);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=rgb(sr,sg,sb);ctx.beginPath();ctx.arc(x,y,r*.62,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=rgb(pr,pg,pb);ctx.font=`bold ${Math.round(r*.56)}px Arial`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(td.abbr,x,y);ctx.textBaseline='alphabetic';
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
}

// ── HUD ───────────────────────────────────────────────────────────────────
function drawHUD(){
  ctx.fillStyle='rgba(3,2,10,.95)';ctx.fillRect(0,0,W,HUD_H);
  ctx.strokeStyle='rgba(255,215,0,.2)';ctx.lineWidth=1;ctx.strokeRect(0,0,W,HUD_H);
  const bw=290;
  // Player side
  logo(44,HUD_H/2,24,player.td);
  const r1=player.hp/player.maxHp;
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(76,7,bw,HUD_H-14);
  ctx.fillStyle=rgb(...player.td.primary);ctx.fillRect(76,7,bw*r1,HUD_H-14);
  ctx.font='bold 14px Arial';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText(player.td.abbr+'  '+player.td.player,82,HUD_H/2-4);
  ctx.font='11px Arial';ctx.fillStyle='rgba(255,255,255,.65)';ctx.fillText('HP '+Math.ceil(player.hp)+' / '+MAX_HP,82,HUD_H/2+13);
  superBar(76,HUD_H-11,bw,player,false);
  // Opp side
  logo(W-44,HUD_H/2,24,opp.td);
  const r2=opp.hp/opp.maxHp;
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(W-76-bw,7,bw,HUD_H-14);
  ctx.fillStyle=rgb(...opp.td.primary);ctx.fillRect(W-76-bw*r2,7,bw*r2,HUD_H-14);
  ctx.font='bold 14px Arial';ctx.textAlign='right';ctx.fillStyle='#fff';ctx.fillText(opp.td.abbr+'  '+opp.td.player,W-82,HUD_H/2-4);
  ctx.font='11px Arial';ctx.fillStyle='rgba(255,255,255,.65)';ctx.fillText('HP '+Math.ceil(opp.hp)+' / '+MAX_HP,W-82,HUD_H/2+13);
  superBar(W-76-bw,HUD_H-11,bw,opp,true);
  // VS center
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(W/2-40,7,80,HUD_H-14);
  ctx.fillStyle='#ffd700';ctx.font='bold 30px Arial';ctx.textAlign='center';ctx.fillText('VS',W/2,HUD_H/2+11);
  // Action text
  if(lastActT>0&&lastAct){
    ctx.save();ctx.globalAlpha=Math.min(1,lastActT/28);
    ctx.fillStyle='rgba(0,0,0,.9)';ctx.fillRect(W-355,HUD_H+6,330,46);
    ctx.fillStyle='#ffd700';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.fillText(lastAct,W-190,HUD_H+36);ctx.restore();
  }
  ctrlBox();
}
function superBar(x,y,w,f,right){
  const[pr,pg,pb]=f.td.primary,r=f.sup/100;
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x,y,w,7);
  ctx.fillStyle=r>=1?'#bb55ff':rgb(pr,pg,pb);
  right?ctx.fillRect(x+w*(1-r),y,w*r,7):ctx.fillRect(x,y,w*r,7);
  if(r>=1){ctx.save();ctx.globalAlpha=.5+.5*Math.sin(tick*.14);ctx.strokeStyle='#bb55ff';ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,7);ctx.restore();}
}
function ctrlBox(){
  const bx=14,by=H-178,bw=230,bh=165;
  ctx.fillStyle='rgba(0,0,0,.9)';ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='rgba(255,215,0,.38)';ctx.lineWidth=1.5;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#ffd700';ctx.font='bold 13px Arial';ctx.textAlign='left';ctx.fillText('COMPLETE THE COMMAND',bx+10,by+20);
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(bx+8,by+26,bw-16,1);
  [['MOVE','← → Arrow Keys'],['ATTACK','Space'],['DASH','Shift'],['SUPER','E (when FULL)']].forEach(([a,k],i)=>{
    const ry=by+46+i*30;
    ctx.fillStyle='rgba(255,215,0,.88)';ctx.font='bold 12px Arial';ctx.textAlign='left';ctx.fillText(a,bx+12,ry);
    ctx.fillStyle='rgba(255,255,255,.88)';ctx.font='12px Arial';ctx.textAlign='right';ctx.fillText(k,bx+bw-12,ry);
    if(i<3){ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(bx+8,ry+8,bw-16,1);}
  });
  if(player&&player.sup>=100){
    ctx.save();ctx.globalAlpha=.55+.45*Math.sin(tick*.15);ctx.fillStyle='#bb55ff';ctx.font='bold 12px Arial';ctx.textAlign='center';
    ctx.fillText('★ SUPER READY! Press E ★',bx+bw/2,by+bh-9);ctx.restore();
  }
}

// ── INPUT ─────────────────────────────────────────────────────────────────
function handleInput(){
  let dx=0;
  if(keys['ArrowLeft'] ||keys['KeyA'])dx=-1;
  if(keys['ArrowRight']||keys['KeyD'])dx=1;
  player.move(dx);
  if(keys['Space']){const h=player.attack(opp);if(h){lastAct='DUNK!';lastActT=70;}keys['Space']=false;}
  if(keys['ShiftLeft']||keys['ShiftRight']){player.dash();lastAct='CROSSOVER!';lastActT=70;keys['ShiftLeft']=keys['ShiftRight']=false;}
  if(keys['KeyE']){if(player.sup>=100){player.useSuper(opp);lastAct='★ SUPERSTAR MOVE! ★';lastActT=110;}keys['KeyE']=false;}
}
function handleSel(){
  if(keys['ArrowRight']){teamSel=(teamSel+1)%6;keys['ArrowRight']=false;}
  if(keys['ArrowLeft']) {teamSel=(teamSel+5)%6;keys['ArrowLeft']=false;}
  if(keys['ArrowDown']) {teamSel=(teamSel+3)%6;keys['ArrowDown']=false;}
  if(keys['ArrowUp'])   {teamSel=(teamSel+3)%6;keys['ArrowUp']=false;}
  if(keys['Enter']||keys['Space']){
    const opKey=ORDER.filter(k=>k!==ORDER[teamSel])[Math.floor(Math.random()*5)];
    player=new Fighter(COURT_L+180,ORDER[teamSel],false);
    opp   =new Fighter(COURT_R-180,opKey,true);
    winner='';lastAct='';lastActT=0;state='playing';
    keys['Enter']=keys['Space']=false;
  }
}

// ── SCREENS ───────────────────────────────────────────────────────────────
function drawMenu(){
  ctx.drawImage(buf,0,0);
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
  const rg=ctx.createRadialGradient(W/2,H*.26,0,W/2,H*.26,500);
  rg.addColorStop(0,'rgba(200,155,50,.3)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.shadowColor='#cc3a00';ctx.shadowBlur=65;
  ctx.font='bold 120px Arial Black,Arial';ctx.fillStyle='#ffd700';ctx.fillText('BASKETBALL',W/2,H*.29);
  ctx.font='bold 88px Arial Black,Arial';ctx.fillStyle='#fff';ctx.fillText('BLITZ',W/2,H*.29+100);
  ctx.shadowBlur=0;
  ctx.font='15px Arial';ctx.fillStyle='rgba(255,215,0,.65)';ctx.fillText('NBA-STYLE 1v1 ARENA BATTLE',W/2,H*.53);
  const p=.78+.22*Math.sin(tick*.06);
  ctx.save();ctx.globalAlpha=p;
  ctx.fillStyle='rgba(200,17,44,.95)';ctx.fillRect(W/2-178,H*.61,356,62);
  ctx.strokeStyle='#ffd700';ctx.lineWidth=2.5;ctx.strokeRect(W/2-178,H*.61,356,62);
  ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.fillText('▶  CLICK TO PLAY',W/2,H*.61+40);ctx.restore();
  ORDER.forEach((key,i)=>{logo(W/2-252+i*105,H*.79,28,TEAMS[key]);});
  ctx.font='12px Arial';ctx.fillStyle='rgba(255,255,255,.38)';ctx.fillText('Choose from 6 NBA teams',W/2,H*.845);
}
function drawTeamSelect(){
  ctx.fillStyle='#06041a';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,0,0,W/2,0,H);
  g.addColorStop(0,'rgba(80,35,130,.25)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.shadowColor='#ffd700';ctx.shadowBlur=22;
  ctx.font='bold 44px Arial';ctx.fillStyle='#ffd700';ctx.fillText('SELECT YOUR TEAM',W/2,56);ctx.shadowBlur=0;
  ctx.font='14px Arial';ctx.fillStyle='rgba(255,255,255,.38)';ctx.fillText('← → Arrow Keys  •  Enter or Space to confirm',W/2,84);
  const cw=318,ch=228,gx=26,gy=24,cols=3;
  const sx=(W-(cols*cw+(cols-1)*gx))/2,sy=110;
  ORDER.forEach((key,i)=>{
    const col=i%cols,row=Math.floor(i/cols);
    const cx2=sx+col*(cw+gx),cy2=sy+row*(ch+gy);
    const td=TEAMS[key],[pr,pg,pb]=td.primary,[sr,sg,sb]=td.secondary,sel=i===teamSel;
    ctx.fillStyle=sel?rgb(pr,pg,pb,.42):'rgba(10,6,20,.98)';
    ctx.fillRect(cx2,cy2,cw,ch);
    if(sel){ctx.shadowColor=rgb(pr,pg,pb);ctx.shadowBlur=32;ctx.strokeStyle=rgb(pr,pg,pb);ctx.lineWidth=3.5;}
    else{ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1;}
    ctx.strokeRect(cx2,cy2,cw,ch);ctx.shadowBlur=0;
    ctx.fillStyle=rgb(pr,pg,pb);ctx.fillRect(cx2,cy2,cw,10);
    logo(cx2+cw/2,cy2+55,36,td);
    // Mini player sketch
    const mx=cx2+cw/2,my=cy2+152;
    ctx.fillStyle=rgb(Math.max(0,pr-65),Math.max(0,pg-65),Math.max(0,pb-65));ctx.fillRect(mx-9,my,18,17);
    ctx.fillStyle=rgb(pr,pg,pb);
    ctx.beginPath();ctx.moveTo(mx-18,my-27);ctx.lineTo(mx+18,my-27);ctx.lineTo(mx+12,my);ctx.lineTo(mx-12,my);ctx.closePath();ctx.fill();
    ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillText(td.number,mx+1,my-15);
    ctx.fillStyle=rgb(sr,sg,sb);ctx.fillText(td.number,mx,my-15);ctx.textBaseline='alphabetic';
    ctx.fillStyle='#b07030';ctx.beginPath();ctx.arc(mx,my-40,12,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=rgb(Math.max(0,pr-40),Math.max(0,pg-40),Math.max(0,pb-40));
    ctx.beginPath();ctx.ellipse(mx,my-46,13,6.5,0,Math.PI,Math.PI*2);ctx.fill();
    ctx.textAlign='center';
    ctx.font='bold 15px Arial';ctx.fillStyle=sel?rgb(sr,sg,sb):'#ddd';ctx.fillText(td.abbr,cx2+cw/2,cy2+176);
    ctx.font='10px Arial';ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillText(td.player,cx2+cw/2,cy2+192);
    const bc2=td.type==='Speed'?'#008ab0':'#c03200';
    ctx.fillStyle=bc2;ctx.fillRect(cx2+cw/2-30,cy2+198,60,22);
    ctx.fillStyle='#fff';ctx.font='bold 9px Arial';ctx.fillText(td.type.toUpperCase(),cx2+cw/2,cy2+213);
  });
}
function drawGameOver(){
  ctx.drawImage(buf,0,0);
  player.x<opp.x?(player.draw(),opp.draw()):(opp.draw(),player.draw());
  drawHUD();
  ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(0,0,W,H);
  const won=winner==='player',wtd=won?player.td:opp.td;
  ctx.textAlign='center';
  ctx.shadowColor=won?'#ffd700':'#ff0808';ctx.shadowBlur=55;
  ctx.font='bold 110px Arial Black,Arial';ctx.fillStyle=won?'#ffd700':'#ff2828';
  ctx.fillText(won?'VICTORY!':'DEFEATED',W/2,H*.37);ctx.shadowBlur=0;
  ctx.font='bold 28px Arial';ctx.fillStyle='#fff';ctx.fillText(wtd.name+' WINS!',W/2,H*.49);
  ctx.font='18px Arial';ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillText('★  '+wtd.player+' is the MVP!  ★',W/2,H*.56);
  const p=.68+.32*Math.sin(tick*.07);
  ctx.save();ctx.globalAlpha=p;
  ctx.fillStyle='rgba(200,17,44,.92)';ctx.fillRect(W/2-180,H*.64,360,62);
  ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.strokeRect(W/2-180,H*.64,360,62);
  ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.fillText('CLICK TO PLAY AGAIN',W/2,H*.64+39);ctx.restore();
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────
function loop(){
  tick++;if(lastActT>0)lastActT--;
  if(state==='team_select')handleSel();
  else if(state==='playing'){
    handleInput();opp.updateAI(player);player.tick();opp.tick();
    if(opp.dead&&!winner){winner='player';state='game_over';}
    if(player.dead&&!winner){winner='opponent';state='game_over';}
  }
  ctx.clearRect(0,0,W,H);
  if(state==='menu')drawMenu();
  else if(state==='team_select')drawTeamSelect();
  else if(state==='playing'){
    ctx.drawImage(buf,0,0);
    player.x<opp.x?(player.draw(),opp.draw()):(opp.draw(),player.draw());
    drawHUD();
  }
  else if(state==='game_over')drawGameOver();
  requestAnimationFrame(loop);
}
loop();
</script>
