<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Basketball Blitz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W=1280,H=720;
const c=document.getElementById('c'),ctx=c.getContext('2d');
c.width=W;c.height=H;
function resize(){const s=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*s+'px';c.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();

const TEAMS={
  bulls:   {name:'Chicago Bulls',        abbr:'CHI',player:'M. Jordan',   primary:[206,17,65],  secondary:[255,255,255],number:'23',type:'Power',atk:22,spd:5.0,paint:[180,12,50]},
  lakers:  {name:'Los Angeles Lakers',   abbr:'LAL',player:'LeBron James',primary:[85,37,130],  secondary:[253,185,39], number:'23',type:'Power',atk:20,spd:5.2,paint:[70,28,110]},
  warriors:{name:'Golden State Warriors',abbr:'GSW',player:'S. Curry',    primary:[29,66,138],  secondary:[255,199,44], number:'30',type:'Speed',atk:14,spd:7.0,paint:[25,60,130]},
  celtics: {name:'Boston Celtics',       abbr:'BOS',player:'J. Tatum',    primary:[0,122,51],   secondary:[255,255,255],number:'0', type:'Power',atk:21,spd:5.2,paint:[0,100,40]},
  heat:    {name:'Miami Heat',           abbr:'MIA',player:'J. Butler',   primary:[152,0,46],   secondary:[255,162,0],  number:'22',type:'Speed',atk:15,spd:6.8,paint:[130,0,38]},
  nets:    {name:'Brooklyn Nets',        abbr:'BKN',player:'K. Durant',   primary:[25,25,25],   secondary:[255,255,255],number:'7', type:'Speed',atk:17,spd:6.5,paint:[20,20,20]},
};
const ORDER=['bulls','lakers','warriors','celtics','heat','nets'];

// Layout – side camera, players face each other left↔right
const HUD_H=58;
const FLOOR_T=260; // top of court (back of court)
const FLOOR_B=H;   // bottom of screen
const PLAYER_Y=520;// player feet y
const CL=80,CR=1200;// court left/right limits
const MAX_HP=260,ATK_CD=24,DASH_CD=100,ATK_RNG=100,DASH_D=150;

const rgb=(r,g,b,a=1)=>`rgba(${r},${g},${b},${a})`;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const dist2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

let state='menu',teamSel=0;
let player,opp,winner='',lastAct='',lastActT=0,tick=0;
const keys={};
document.addEventListener('keydown',e=>{keys[e.code]=true;e.preventDefault();});
document.addEventListener('keyup',  e=>{keys[e.code]=false;});
c.addEventListener('click',()=>{
  if(state==='menu')state='team_select';
  else if(state==='game_over'){player=opp=null;winner='';state='menu';}
});

// ── PRE-RENDER STATIC ARENA ───────────────────────────────────────────────
const buf=document.createElement('canvas');buf.width=W;buf.height=H;
const bc=buf.getContext('2d');

function buildArena(paintColor){
  bc.clearRect(0,0,W,H);

  // 1. Ceiling/upper arena – very dark
  const cg=bc.createLinearGradient(0,0,0,FLOOR_T);
  cg.addColorStop(0,'#020108');cg.addColorStop(.7,'#0c0820');cg.addColorStop(1,'#16102e');
  bc.fillStyle=cg;bc.fillRect(0,0,W,FLOOR_T);

  // 2. Spotlight beams from ceiling
  bc.save();bc.globalAlpha=.07;
  for(let i=0;i<9;i++){
    const lx=60+i*148;
    const lg=bc.createLinearGradient(lx,0,lx,FLOOR_T);
    lg.addColorStop(0,'rgba(255,235,160,1)');lg.addColorStop(1,'rgba(255,235,160,0)');
    bc.fillStyle=lg;
    bc.beginPath();bc.moveTo(lx,0);bc.lineTo(lx-100,FLOOR_T);bc.lineTo(lx+100,FLOOR_T);bc.closePath();bc.fill();
  }
  bc.restore();

  // 3. Upper stands – 3 sections (left, far, right)
  // Far stands (top, narrow band)
  const farSg=bc.createLinearGradient(0,HUD_H,0,FLOOR_T-40);
  farSg.addColorStop(0,'#0e0c1e');farSg.addColorStop(1,'#1a1630');
  bc.fillStyle=farSg;bc.fillRect(0,HUD_H,W,FLOOR_T-HUD_H-20);

  // Left stand shape
  bc.save();bc.fillStyle='#12101f';
  bc.beginPath();bc.moveTo(0,HUD_H);bc.lineTo(0,FLOOR_B);bc.lineTo(CL,FLOOR_B);bc.lineTo(CL,FLOOR_T);bc.lineTo(130,HUD_H);bc.closePath();bc.fill();
  // Right stand shape
  bc.beginPath();bc.moveTo(W,HUD_H);bc.lineTo(W,FLOOR_B);bc.lineTo(CR,FLOOR_B);bc.lineTo(CR,FLOOR_T);bc.lineTo(W-130,HUD_H);bc.closePath();bc.fill();
  bc.restore();

  // 4. Crowd in stands
  const shirts=['#cc2020','#2828cc','#208820','#c8a800','#c85020','#6820cc','#20c8c8','#cc20cc','#888','#fff'];
  const skins=['#d4a870','#a06030','#c89060','#805028','#e8c098','#6a3818'];

  function drawCrowdRow(x0,x1,y,rowDensity,personH){
    const step=rowDensity;
    for(let x=x0;x<x1;x+=step){
      const jx=x+Math.sin(x*.4+y*.3)*2;
      const jy=y+Math.cos(x*.5+y*.2)*2;
      const sz=personH;
      bc.fillStyle=shirts[(Math.floor(x*.15)+Math.floor(y*.07))%shirts.length];
      bc.beginPath();bc.ellipse(jx,jy,sz*.45,sz*.65,0,0,Math.PI*2);bc.fill();
      bc.fillStyle=skins[(Math.floor(x*.12)+Math.floor(y*.05))%skins.length];
      bc.beginPath();bc.arc(jx,jy-sz*.6,sz*.28,0,Math.PI*2);bc.fill();
    }
  }

  // Far crowd (top, 8 rows)
  for(let row=0;row<8;row++){
    const y=HUD_H+14+row*26;
    drawCrowdRow(80,W-80,y,14+row,10-row*.5);
  }
  // Left side crowd
  for(let row=0;row<5;row++){
    const y=FLOOR_T-60-row*40;
    drawCrowdRow(0,CL+50,y,18,11);
  }
  // Right side crowd
  for(let row=0;row<5;row++){
    const y=FLOOR_T-60-row*40;
    drawCrowdRow(CR-50,W,y,18,11);
  }

  // 5. Scoreboard (hanging center)
  const sbW=260,sbH=80,sbX=W/2-130,sbY=HUD_H+5;
  bc.strokeStyle='#444';bc.lineWidth=3;
  bc.beginPath();bc.moveTo(sbX+55,0);bc.lineTo(sbX+55,sbY);bc.stroke();
  bc.beginPath();bc.moveTo(sbX+sbW-55,0);bc.lineTo(sbX+sbW-55,sbY);bc.stroke();
  // Scoreboard frame
  bc.fillStyle='#080415';bc.fillRect(sbX,sbY,sbW,sbH);
  bc.strokeStyle='rgba(255,215,0,.6)';bc.lineWidth=2;bc.strokeRect(sbX,sbY,sbW,sbH);
  // Red header bar
  bc.fillStyle='#aa0018';bc.fillRect(sbX,sbY,sbW,22);
  bc.fillStyle='#fff';bc.font='bold 13px Arial';bc.textAlign='center';
  bc.fillText('NBA  BASKETBALL  BLITZ',W/2,sbY+15);
  // Clock display
  bc.fillStyle='#ffd700';bc.font='bold 36px "Courier New",monospace';
  bc.fillText('2:00',W/2,sbY+66);
  bc.fillStyle='rgba(255,255,255,.5)';bc.font='10px Arial';bc.fillText('QUARTER  1',W/2,sbY+78);

  // 6. Court floor (very light maple – like the 2K screenshot)
  // Perspective: back top edge narrower, front bottom full width
  const bL=CL,bR=CR;  // back (top) left/right
  const fL=0,fR=W;    // front (bottom) left/right

  const fg=bc.createLinearGradient(0,FLOOR_T,0,FLOOR_B);
  fg.addColorStop(0,'#e8d49a');
  fg.addColorStop(.2,'#f2e2b0');
  fg.addColorStop(.55,'#f8ecc0');
  fg.addColorStop(.8,'#f4e8b4');
  fg.addColorStop(1,'#e8d898');
  bc.fillStyle=fg;
  bc.beginPath();bc.moveTo(bL,FLOOR_T);bc.lineTo(bR,FLOOR_T);bc.lineTo(fR,FLOOR_B);bc.lineTo(fL,FLOOR_B);bc.closePath();bc.fill();

  // Wood grain lines
  bc.save();bc.globalAlpha=.04;
  const GRAINS=50;
  for(let i=0;i<GRAINS;i++){
    const t=i/GRAINS;
    const y=lerp(FLOOR_T,FLOOR_B,t);
    const xl=lerp(bL,fL,t),xr=lerp(bR,fR,t);
    bc.fillStyle=i%2===0?'rgba(0,0,0,1)':'rgba(255,255,255,1)';
    bc.fillRect(xl,y,xr-xl,(FLOOR_B-FLOOR_T)/GRAINS*.55);
  }
  bc.restore();

  // 7. Court lines helper
  function proj(wx,wy){
    return{x:lerp(lerp(bL,fL,wy),lerp(bR,fR,wy),wx),y:lerp(FLOOR_T,FLOOR_B,wy)};
  }
  function pline(x1,y1,x2,y2){
    const a=proj(x1,y1),b=proj(x2,y2);
    bc.beginPath();bc.moveTo(a.x,a.y);bc.lineTo(b.x,b.y);bc.stroke();
  }
  function parc(cx,cy,rx,ry,sa,ea,N=64){
    bc.beginPath();
    for(let i=0;i<=N;i++){
      const ang=sa+(ea-sa)*i/N;
      const p=proj(cx+Math.cos(ang)*rx,cy+Math.sin(ang)*ry);
      i===0?bc.moveTo(p.x,p.y):bc.lineTo(p.x,p.y);
    }bc.stroke();
  }
  function pfill(pts,col){
    bc.fillStyle=col;
    bc.beginPath();pts.forEach((p,i)=>i===0?bc.moveTo(p.x,p.y):bc.lineTo(p.x,p.y));bc.closePath();bc.fill();
  }

  // 8. Paint zones (blue, like the 2K screenshot)
  const[pc1,pc2,pc3]=paintColor;
  const paintCol=rgb(pc1,pc2,pc3,.85);
  // Left paint: x 0→.19, y .12→.88
  pfill([proj(0,.12),proj(.19,.12),proj(.19,.88),proj(0,.88)],paintCol);
  // Right paint: x .81→1, y .12→.88
  pfill([proj(.81,.12),proj(1,.12),proj(1,.88),proj(.81,.88)],paintCol);

  bc.strokeStyle='rgba(255,255,255,.95)';bc.lineWidth=2.5;

  // Court outline
  bc.beginPath();bc.moveTo(bL,FLOOR_T);bc.lineTo(bR,FLOOR_T);bc.lineTo(fR,FLOOR_B);bc.lineTo(fL,FLOOR_B);bc.closePath();bc.stroke();
  // Center line
  pline(.5,0,.5,1);
  // Paint borders
  pline(0,.12,.19,.12);pline(.19,.12,.19,.88);pline(0,.88,.19,.88);
  pline(.81,.12,1,.12);pline(.81,.12,.81,.88);pline(.81,.88,1,.88);
  // Free throw arcs
  bc.lineWidth=2.5;
  parc(.19,.5,.12,.35,-Math.PI/2,Math.PI/2);
  parc(.81,.5,.12,.35,Math.PI/2,Math.PI*1.5);
  // 3-point arcs
  bc.lineWidth=3;
  parc(.19,.5,.19,.52,-Math.PI/2,Math.PI/2);
  parc(.81,.5,.19,.52,Math.PI/2,Math.PI*1.5);
  // Center circle
  parc(.5,.5,.09,.25,0,Math.PI*2);
  // Restricted area arcs (small)
  bc.lineWidth=2;
  parc(.06,.5,.05,.14,0,Math.PI);
  parc(.94,.5,.05,.14,0,Math.PI);

  // 9. Hoops (side profile)
  // Project hoop positions
  const hoopL=proj(.04,.5),hoopR=proj(.96,.5);
  drawHoop(bc,hoopL.x,hoopL.y,1);
  drawHoop(bc,hoopR.x,hoopR.y,-1);

  // 10. Arena side walls / floor shadows
  bc.save();bc.globalAlpha=.18;
  const leftShadow=bc.createLinearGradient(CL,0,CL+80,0);
  leftShadow.addColorStop(0,'rgba(0,0,0,1)');leftShadow.addColorStop(1,'rgba(0,0,0,0)');
  bc.fillStyle=leftShadow;bc.fillRect(CL,FLOOR_T,80,FLOOR_B-FLOOR_T);
  const rightShadow=bc.createLinearGradient(CR-80,0,CR,0);
  rightShadow.addColorStop(0,'rgba(0,0,0,0)');rightShadow.addColorStop(1,'rgba(0,0,0,1)');
  bc.fillStyle=rightShadow;bc.fillRect(CR-80,FLOOR_T,80,FLOOR_B-FLOOR_T);
  bc.restore();
}

function drawHoop(c2,x,y,dir){
  // dir: 1=hoop extends right, -1=extends left
  const d=dir;
  // Pole
  c2.fillStyle='#555565';c2.fillRect(x-3,y-90,6,90);
  // Back board
  c2.fillStyle='rgba(200,220,255,.82)';
  c2.strokeStyle='rgba(200,220,255,.9)';c2.lineWidth=2.5;
  c2.fillRect(x-5,y-82,10,58);c2.strokeRect(x-5,y-82,10,58);
  // Target square on backboard
  c2.strokeStyle='#ff4444';c2.lineWidth=1.8;c2.strokeRect(x-4,y-62,8,26);
  // Arm to rim
  const rimX=x+d*38;
  c2.strokeStyle='#777';c2.lineWidth=3.5;
  c2.beginPath();c2.moveTo(x,y-50);c2.lineTo(rimX,y-50);c2.stroke();
  // Rim (orange ellipse)
  c2.strokeStyle='#e06808';c2.lineWidth=5;
  c2.beginPath();c2.ellipse(rimX,y-50,24,7,0,0,Math.PI*2);c2.stroke();
  // Net (8 strings)
  c2.strokeStyle='rgba(245,245,245,.65)';c2.lineWidth=1.2;
  for(let i=0;i<9;i++){
    const a=(i/8)*Math.PI*2;
    c2.beginPath();c2.moveTo(rimX+Math.cos(a)*24,y-50+Math.sin(a)*7);c2.lineTo(rimX+Math.cos(a)*15,y-24);c2.stroke();
  }
  c2.beginPath();c2.ellipse(rimX,y-30,18,5,0,0,Math.PI*2);c2.stroke();
  c2.beginPath();c2.ellipse(rimX,y-20,11,3,0,0,Math.PI*2);c2.stroke();
}

// Initialize with generic blue paint
buildArena([30,70,150]);

// ── PLAYER SPRITE ─────────────────────────────────────────────────────────
// Upright side-view player, proportioned like a basketball player (tall, lean)
function drawPlayer(x,y,td,facing,flash,supAct,walkPhase){
  const[pr,pg,pb]=td.primary,[sr,sg,sb]=td.secondary;
  const[jr,jg,jb]=flash?[255,50,50]:[pr,pg,pb];
  const ws=Math.sin(walkPhase*Math.PI*2);

  // Proportions (total height ~130px)
  const H_TOT=130;
  const HEAD_R=15;
  const TORSO_H=36;
  const SHORT_H=22;
  const SHIN_H=28;
  const FOOT_H=8;
  const SHOULDER_W=26;
  const HIP_W=18;
  const ARM_W=11;
  const ARM_H=30;

  const footY=y;
  const kneeY=footY-SHIN_H-FOOT_H;
  const hipY=kneeY-SHORT_H;
  const shouldY=hipY-TORSO_H;
  const headCY=shouldY-HEAD_R-4;

  // Super glow
  if(supAct>0){
    ctx.save();ctx.globalAlpha=.18+.1*Math.sin(tick*.12);
    const ag=ctx.createRadialGradient(x,y-H_TOT/2,5,x,y-H_TOT/2,H_TOT*.75);
    ag.addColorStop(0,'rgba(0,255,180,.7)');ag.addColorStop(1,'rgba(0,255,180,0)');
    ctx.fillStyle=ag;ctx.fillRect(x-90,y-H_TOT*1.15,180,H_TOT*1.3);ctx.restore();
  }

  // Floor shadow
  ctx.save();ctx.globalAlpha=.2;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(x,footY+6,SHOULDER_W*1.6,6,0,0,Math.PI*2);ctx.fill();ctx.restore();

  // === LEGS ===
  const L_OFF=ws*(facing>0?9:-9); // left leg forward/back

  // LEFT LEG (back)
  // Shorts portion
  ctx.fillStyle=rgb(Math.max(0,jr-55),Math.max(0,jg-55),Math.max(0,jb-55));
  ctx.beginPath();ctx.roundRect(x-HIP_W*.9,hipY+L_OFF,HIP_W*.9,SHORT_H+4,3);ctx.fill();
  // Shin
  ctx.fillStyle='#c09060';
  ctx.beginPath();ctx.roundRect(x-HIP_W*.75,kneeY+L_OFF,10,SHIN_H,2);ctx.fill();
  // Shoe
  ctx.fillStyle=rgb(sr,sg,sb);
  ctx.beginPath();ctx.roundRect(x-HIP_W*.75-4,footY+L_OFF,22,FOOT_H,3);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(x-HIP_W*.75-4,footY+L_OFF,22,3);

  // RIGHT LEG (forward)
  const R_OFF=-L_OFF;
  ctx.fillStyle=rgb(Math.max(0,jr-55),Math.max(0,jg-55),Math.max(0,jb-55));
  ctx.beginPath();ctx.roundRect(x+HIP_W*.0,hipY+R_OFF,HIP_W*.9,SHORT_H+4,3);ctx.fill();
  ctx.fillStyle='#c09060';
  ctx.beginPath();ctx.roundRect(x+HIP_W*.15,kneeY+R_OFF,10,SHIN_H,2);ctx.fill();
  ctx.fillStyle=rgb(sr,sg,sb);
  ctx.beginPath();ctx.roundRect(x+HIP_W*.15-4,footY+R_OFF,22,FOOT_H,3);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(x+HIP_W*.15-4,footY+R_OFF,22,3);

  // === BACK ARM ===
  const backArmX=facing>0?x-SHOULDER_W+4:x+SHOULDER_W-4;
  ctx.save();ctx.translate(backArmX,shouldY+6);ctx.rotate(facing>0?.5+ws*.2:-.5-ws*.2);
  ctx.fillStyle=rgb(jr,jg,jb);ctx.beginPath();ctx.roundRect(-ARM_W/2,0,ARM_W,ARM_H*.45,3);ctx.fill();
  ctx.fillStyle='#c09060';ctx.beginPath();ctx.roundRect(-ARM_W/2+1,ARM_H*.43,ARM_W-2,ARM_H*.55,3);ctx.fill();
  ctx.restore();

  // === JERSEY BODY ===
  ctx.fillStyle=rgb(jr,jg,jb);
  ctx.beginPath();
  ctx.moveTo(x-SHOULDER_W,shouldY+2);ctx.lineTo(x+SHOULDER_W,shouldY+2);
  ctx.lineTo(x+HIP_W,hipY);ctx.lineTo(x-HIP_W,hipY);ctx.closePath();ctx.fill();
  // Jersey stripes / collar
  ctx.fillStyle=rgb(sr,sg,sb);ctx.fillRect(x-SHOULDER_W+2,shouldY+2,SHOULDER_W*2-4,4);
  // Jersey number
  ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillText(td.number,x+1,shouldY+TORSO_H*.52+1);
  ctx.fillStyle=rgb(sr,sg,sb);ctx.fillText(td.number,x,shouldY+TORSO_H*.52);
  ctx.textBaseline='alphabetic';
  // Jersey outline
  ctx.strokeStyle=flash?'#fff':rgb(sr,sg,sb,.6);ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(x-SHOULDER_W,shouldY+2);ctx.lineTo(x+SHOULDER_W,shouldY+2);ctx.lineTo(x+HIP_W,hipY);ctx.lineTo(x-HIP_W,hipY);ctx.closePath();ctx.stroke();

  // === FRONT ARM ===
  const frontArmX=facing>0?x+SHOULDER_W-4:x-SHOULDER_W+4;
  ctx.save();ctx.translate(frontArmX,shouldY+6);ctx.rotate(facing>0?-.2-ws*.2:.2+ws*.2);
  ctx.fillStyle=rgb(jr,jg,jb);ctx.beginPath();ctx.roundRect(-ARM_W/2,0,ARM_W,ARM_H*.45,3);ctx.fill();
  ctx.fillStyle='#c09060';ctx.beginPath();ctx.roundRect(-ARM_W/2+1,ARM_H*.43,ARM_W-2,ARM_H*.55,3);ctx.fill();
  ctx.restore();

  // === HEAD ===
  // Neck
  ctx.fillStyle='#c09060';ctx.fillRect(x-5,headCY+HEAD_R-2,10,10);
  // Head
  ctx.fillStyle='#c09060';ctx.beginPath();ctx.arc(x,headCY,HEAD_R,0,Math.PI*2);ctx.fill();
  // Hair (dark top)
  ctx.fillStyle='#180a00';ctx.beginPath();ctx.arc(x,headCY,HEAD_R,Math.PI,Math.PI*2);ctx.fill();
  // Eye
  const eyeX=facing>0?x+HEAD_R*.5:x-HEAD_R*.5;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(eyeX,headCY+HEAD_R*.3,3.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a0800';ctx.beginPath();ctx.arc(eyeX+facing*.8,headCY+HEAD_R*.3,1.8,0,Math.PI*2);ctx.fill();
  // Headband
  ctx.strokeStyle=rgb(sr,sg,sb);ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(x,headCY,HEAD_R+1,Math.PI*.9,Math.PI*2.1);ctx.stroke();
  // Cap top
  ctx.fillStyle=rgb(Math.max(0,pr-40),Math.max(0,pg-40),Math.max(0,pb-40));
  ctx.beginPath();ctx.ellipse(x,headCY-HEAD_R*.5,HEAD_R*1.15,HEAD_R*.55,0,Math.PI,Math.PI*2);ctx.fill();
  // Cap brim
  ctx.fillStyle=rgb(Math.max(0,pr-65),Math.max(0,pg-65),Math.max(0,pb-65));
  ctx.beginPath();ctx.ellipse(x+facing*(HEAD_R+9),headCY+HEAD_R*.15,HEAD_R*.55,4,0,0,Math.PI*2);ctx.fill();

  // Attack flash
  if(flash){
    ctx.save();ctx.globalAlpha=.45;ctx.strokeStyle='#ffe040';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(x,headCY+H_TOT/2,58,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
}

// ── FIGHTER CLASS ─────────────────────────────────────────────────────────
class Fighter{
  constructor(x,key,ai=false){
    this.x=x;this.y=PLAYER_Y;this.teamKey=key;this.td=TEAMS[key];this.ai=ai;
    this.hp=MAX_HP;this.maxHp=MAX_HP;this.sup=0;
    this.atkCd=0;this.dashCd=0;this.supAct=0;
    this.dmgFl=0;this.atkFl=0;this.trail=[];
    this.facing=ai?-1:1;this.aiDashT=0;
    this.spd=this.td.spd;this.dmg=this.td.atk;
    this.walkPhase=0;this.moving=false;
  }
  get dead(){return this.hp<=0;}
  move(dx){
    if(dx)this.facing=dx>0?1:-1;
    this.moving=!!dx;
    this.x=clamp(this.x+dx*this.spd,CL+32,CR-32);
    if(this.moving)this.walkPhase=(this.walkPhase+.07)%1;
  }
  dash(){
    if(this.dashCd>0)return;this.dashCd=DASH_CD;
    const nx=clamp(this.x+this.facing*DASH_D,CL+32,CR-32);
    for(let i=0;i<7;i++)this.trail.push({x:lerp(this.x,nx,i/7),y:this.y,a:.55,td:this.td});
    this.x=nx;
  }
  attack(t){
    if(this.atkCd>0)return false;this.atkCd=ATK_CD;this.atkFl=14;
    if(dist2(this,t)<=ATK_RNG){t.hp=Math.max(0,t.hp-this.dmg);t.dmgFl=16;this.sup=Math.min(100,this.sup+13);return true;}
    return false;
  }
  useSuper(t){
    if(this.sup<100)return;this.sup=0;
    if(this.td.type==='Power'){if(dist2(this,t)<=ATK_RNG*2.8){t.hp=Math.max(0,t.hp-65);t.dmgFl=22;}}
    else this.supAct=300;
  }
  updateAI(t){
    const d=dist2(this,t),dx=this.x<t.x?1:-1;
    if(d>ATK_RNG*.8)this.move(dx);else this.moving=false;
    if(d<=ATK_RNG){this.attack(t);if(this.sup>=100)this.useSuper(t);}
    if(--this.aiDashT<=0&&d>ATK_RNG*1.5&&Math.random()<.016){this.facing=dx;this.dash();this.aiDashT=160;}
  }
  tick(){
    ['atkCd','dashCd','dmgFl','atkFl','supAct'].forEach(k=>{if(this[k]>0)this[k]--;});
    this.trail=this.trail.filter(t=>{t.a-=.07;return t.a>0;});
  }
  draw(){
    for(const t of this.trail){
      const[pr,pg,pb]=t.td.primary;
      ctx.save();ctx.globalAlpha=t.a*.38;ctx.fillStyle=rgb(pr,pg,pb);
      ctx.beginPath();ctx.ellipse(t.x,t.y-65,20,62,0,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    if(this.atkFl>0){
      ctx.save();ctx.globalAlpha=this.atkFl/14;ctx.strokeStyle='#ffe040';ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(this.x,this.y-65,55,0,Math.PI*2);ctx.stroke();ctx.restore();
    }
    drawPlayer(this.x,this.y,this.td,this.facing,this.dmgFl>0,this.supAct,this.walkPhase);
    // Name tag
    const[sr,sg,sb]=this.td.secondary;
    ctx.font='bold 13px Arial';ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,0,.82)';ctx.fillRect(this.x-50,this.y-162,100,20);
    ctx.fillStyle=rgb(sr,sg,sb);ctx.fillText('★ '+this.td.player,this.x,this.y-147);
    // Quick HP bar under name
    const bw=82,bx=this.x-41,by=this.y-144;
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(bx-1,by-1,bw+2,8);
    const r=this.hp/this.maxHp;
    ctx.fillStyle=r>.3?'#22e044':'#e02020';ctx.fillRect(bx,by,bw*r,6);
  }
}

// ── LOGO ──────────────────────────────────────────────────────────────────
function logo(x,y,r,td){
  const[pr,pg,pb]=td.primary,[sr,sg,sb]=td.secondary;
  ctx.fillStyle=rgb(pr,pg,pb);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=rgb(sr,sg,sb);ctx.beginPath();ctx.arc(x,y,r*.62,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=rgb(pr,pg,pb);ctx.font=`bold ${Math.round(r*.56)}px Arial`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(td.abbr,x,y);ctx.textBaseline='alphabetic';
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
}

// ── HUD ───────────────────────────────────────────────────────────────────
function drawHUD(){
  ctx.fillStyle='rgba(3,2,12,.96)';ctx.fillRect(0,0,W,HUD_H);
  ctx.strokeStyle='rgba(255,215,0,.18)';ctx.lineWidth=1;ctx.strokeRect(0,0,W,HUD_H);
  const bw=285;
  // Player
  logo(44,HUD_H/2,24,player.td);
  const r1=player.hp/player.maxHp;
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(76,7,bw,HUD_H-14);
  ctx.fillStyle=rgb(...player.td.primary);ctx.fillRect(76,7,bw*r1,HUD_H-14);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(76+bw*r1,7,bw*(1-r1),HUD_H-14);
  ctx.font='bold 14px Arial';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText(player.td.abbr+'  '+player.td.player,82,HUD_H/2-4);
  ctx.font='11px Arial';ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillText('HP '+Math.ceil(player.hp)+' / '+MAX_HP,82,HUD_H/2+12);
  supBar(76,HUD_H-11,bw,player,false);
  // Opp
  logo(W-44,HUD_H/2,24,opp.td);
  const r2=opp.hp/opp.maxHp;
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(W-76-bw,7,bw,HUD_H-14);
  ctx.fillStyle=rgb(...opp.td.primary);ctx.fillRect(W-76-bw*r2,7,bw*r2,HUD_H-14);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(W-76-bw,7,bw*(1-r2),HUD_H-14);
  ctx.font='bold 14px Arial';ctx.textAlign='right';ctx.fillStyle='#fff';ctx.fillText(opp.td.abbr+'  '+opp.td.player,W-82,HUD_H/2-4);
  ctx.font='11px Arial';ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillText('HP '+Math.ceil(opp.hp)+' / '+MAX_HP,W-82,HUD_H/2+12);
  supBar(W-76-bw,HUD_H-11,bw,opp,true);
  // VS
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(W/2-40,7,80,HUD_H-14);
  ctx.fillStyle='#ffd700';ctx.font='bold 30px Arial';ctx.textAlign='center';ctx.fillText('VS',W/2,HUD_H/2+11);
  // Action text
  if(lastActT>0&&lastAct){
    ctx.save();ctx.globalAlpha=Math.min(1,lastActT/28);
    ctx.fillStyle='rgba(0,0,0,.9)';ctx.fillRect(W-358,HUD_H+5,340,46);
    ctx.fillStyle='#ffd700';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.fillText(lastAct,W-188,HUD_H+34);ctx.restore();
  }
  ctrlBox();
}
function supBar(x,y,w,f,right){
  const[pr,pg,pb]=f.td.primary,r=f.sup/100;
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x,y,w,6);
  ctx.fillStyle=r>=1?'#bb55ff':rgb(pr,pg,pb);
  right?ctx.fillRect(x+w*(1-r),y,w*r,6):ctx.fillRect(x,y,w*r,6);
  if(r>=1){ctx.save();ctx.globalAlpha=.5+.5*Math.sin(tick*.14);ctx.strokeStyle='#bb55ff';ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,6);ctx.restore();}
}
function ctrlBox(){
  const bx=14,by=H-170,bw=228,bh=158;
  ctx.fillStyle='rgba(0,0,0,.9)';ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='rgba(255,215,0,.4)';ctx.lineWidth=1.5;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#ffd700';ctx.font='bold 13px Arial';ctx.textAlign='left';ctx.fillText('CONTROLS',bx+10,by+20);
  ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(bx+8,by+26,bw-16,1);
  [['MOVE','← → Arrow Keys'],['ATTACK','Space'],['DASH','Shift'],['SUPER','E (when FULL)']].forEach(([a,k],i)=>{
    const ry=by+46+i*28;
    ctx.fillStyle='rgba(255,215,0,.9)';ctx.font='bold 12px Arial';ctx.textAlign='left';ctx.fillText(a,bx+12,ry);
    ctx.fillStyle='rgba(255,255,255,.88)';ctx.font='12px Arial';ctx.textAlign='right';ctx.fillText(k,bx+bw-12,ry);
    if(i<3){ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(bx+8,ry+7,bw-16,1);}
  });
  if(player&&player.sup>=100){
    ctx.save();ctx.globalAlpha=.55+.45*Math.sin(tick*.15);ctx.fillStyle='#bb55ff';ctx.font='bold 12px Arial';ctx.textAlign='center';
    ctx.fillText('★ SUPER READY! Press E ★',bx+bw/2,by+bh-9);ctx.restore();
  }
}

// ── INPUT ─────────────────────────────────────────────────────────────────
function handleInput(){
  let dx=0;
  if(keys['ArrowLeft']||keys['KeyA'])dx=-1;
  if(keys['ArrowRight']||keys['KeyD'])dx=1;
  player.move(dx);
  if(keys['Space']){const h=player.attack(opp);if(h){lastAct='DUNK!';lastActT=70;}keys['Space']=false;}
  if(keys['ShiftLeft']||keys['ShiftRight']){player.dash();lastAct='CROSSOVER!';lastActT=70;keys['ShiftLeft']=keys['ShiftRight']=false;}
  if(keys['KeyE']){if(player.sup>=100){player.useSuper(opp);lastAct='★ SUPERSTAR MOVE! ★';lastActT=110;}keys['KeyE']=false;}
}
function handleSel(){
  if(keys['ArrowRight']){teamSel=(teamSel+1)%6;keys['ArrowRight']=false;}
  if(keys['ArrowLeft']) {teamSel=(teamSel+5)%6;keys['ArrowLeft']=false;}
  if(keys['ArrowDown']) {teamSel=(teamSel+3)%6;keys['ArrowDown']=false;}
  if(keys['ArrowUp'])   {teamSel=(teamSel+3)%6;keys['ArrowUp']=false;}
  if(keys['Enter']||keys['Space']){
    const opKey=ORDER.filter(k=>k!==ORDER[teamSel])[Math.floor(Math.random()*5)];
    const myKey=ORDER[teamSel];
    player=new Fighter(CL+180,myKey,false);
    opp   =new Fighter(CR-180,opKey,true);
    // Re-render arena with home team paint color
    buildArena(TEAMS[myKey].paint);
    winner='';lastAct='';lastActT=0;state='playing';
    keys['Enter']=keys['Space']=false;
  }
}

// ── SCREENS ───────────────────────────────────────────────────────────────
function drawMenu(){
  ctx.drawImage(buf,0,0);
  ctx.fillStyle='rgba(0,0,0,.52)';ctx.fillRect(0,0,W,H);
  const rg=ctx.createRadialGradient(W/2,H*.28,0,W/2,H*.28,520);
  rg.addColorStop(0,'rgba(210,165,45,.28)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.shadowColor='#cc3500';ctx.shadowBlur=70;
  ctx.font='bold 116px Arial Black,Arial';ctx.fillStyle='#ffd700';ctx.fillText('BASKETBALL',W/2,H*.3);
  ctx.font='bold 84px Arial Black,Arial';ctx.fillStyle='#fff';ctx.fillText('BLITZ',W/2,H*.3+96);
  ctx.shadowBlur=0;
  ctx.font='15px Arial';ctx.fillStyle='rgba(255,215,0,.6)';ctx.fillText('NBA-STYLE 1v1 ARENA BATTLE',W/2,H*.53);
  const p=.76+.24*Math.sin(tick*.06);
  ctx.save();ctx.globalAlpha=p;
  ctx.fillStyle='rgba(198,16,44,.95)';ctx.fillRect(W/2-178,H*.61,356,62);
  ctx.strokeStyle='#ffd700';ctx.lineWidth=2.5;ctx.strokeRect(W/2-178,H*.61,356,62);
  ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.fillText('▶  CLICK TO PLAY',W/2,H*.61+40);ctx.restore();
  ORDER.forEach((key,i)=>{logo(W/2-250+i*105,H*.785,28,TEAMS[key]);});
  ctx.font='12px Arial';ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillText('6 NBA teams to choose from',W/2,H*.848);
}
function drawTeamSelect(){
  ctx.fillStyle='#060418';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,0,0,W/2,0,H);
  g.addColorStop(0,'rgba(80,32,135,.28)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.shadowColor='#ffd700';ctx.shadowBlur=24;
  ctx.font='bold 44px Arial';ctx.fillStyle='#ffd700';ctx.fillText('SELECT YOUR TEAM',W/2,56);ctx.shadowBlur=0;
  ctx.font='14px Arial';ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillText('← → to browse  •  Enter or Space to confirm',W/2,84);
  const cw=318,ch=228,gx=22,gy=22,cols=3;
  const sx=(W-(cols*cw+(cols-1)*gx))/2,sy=108;
  ORDER.forEach((key,i)=>{
    const col=i%cols,row=Math.floor(i/cols);
    const cx2=sx+col*(cw+gx),cy2=sy+row*(ch+gy);
    const td=TEAMS[key],[pr,pg,pb]=td.primary,[sr,sg,sb]=td.secondary,sel=i===teamSel;
    ctx.fillStyle=sel?rgb(pr,pg,pb,.4):'rgba(10,6,22,.97)';ctx.fillRect(cx2,cy2,cw,ch);
    if(sel){ctx.shadowColor=rgb(pr,pg,pb);ctx.shadowBlur=35;ctx.strokeStyle=rgb(pr,pg,pb);ctx.lineWidth=3.5;}
    else{ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;}
    ctx.strokeRect(cx2,cy2,cw,ch);ctx.shadowBlur=0;
    ctx.fillStyle=rgb(pr,pg,pb);ctx.fillRect(cx2,cy2,cw,10);
    logo(cx2+cw/2,cy2+55,36,td);
    // Mini sprite
    const mx=cx2+cw/2,my=cy2+152;
    ctx.fillStyle=rgb(Math.max(0,pr-60),Math.max(0,pg-60),Math.max(0,pb-60));ctx.fillRect(mx-8,my,16,16);
    ctx.fillStyle=rgb(pr,pg,pb);ctx.beginPath();ctx.moveTo(mx-18,my-28);ctx.lineTo(mx+18,my-28);ctx.lineTo(mx+12,my);ctx.lineTo(mx-12,my);ctx.closePath();ctx.fill();
    ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillText(td.number,mx+1,my-16);
    ctx.fillStyle=rgb(sr,sg,sb);ctx.fillText(td.number,mx,my-16);ctx.textBaseline='alphabetic';
    ctx.fillStyle='#c09060';ctx.beginPath();ctx.arc(mx,my-42,12,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=rgb(Math.max(0,pr-42),Math.max(0,pg-42),Math.max(0,pb-42));
    ctx.beginPath();ctx.ellipse(mx,my-48,13,6,0,Math.PI,Math.PI*2);ctx.fill();
    ctx.textAlign='center';
    ctx.font='bold 15px Arial';ctx.fillStyle=sel?rgb(sr,sg,sb):'#ddd';ctx.fillText(td.abbr,cx2+cw/2,cy2+177);
    ctx.font='10px Arial';ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillText(td.player,cx2+cw/2,cy2+193);
    const bc2=td.type==='Speed'?'#008ab0':'#c03200';
    ctx.fillStyle=bc2;ctx.fillRect(cx2+cw/2-30,cy2+199,60,22);
    ctx.fillStyle='#fff';ctx.font='bold 9px Arial';ctx.fillText(td.type.toUpperCase(),cx2+cw/2,cy2+214);
  });
}
function drawGameOver(){
  ctx.drawImage(buf,0,0);
  player.x<opp.x?(player.draw(),opp.draw()):(opp.draw(),player.draw());
  drawHUD();
  ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(0,0,W,H);
  const won=winner==='player',wtd=won?player.td:opp.td;
  ctx.textAlign='center';
  ctx.shadowColor=won?'#ffd700':'#ff0808';ctx.shadowBlur=55;
  ctx.font='bold 110px Arial Black,Arial';ctx.fillStyle=won?'#ffd700':'#ff2828';
  ctx.fillText(won?'VICTORY!':'DEFEATED',W/2,H*.37);ctx.shadowBlur=0;
  ctx.font='bold 28px Arial';ctx.fillStyle='#fff';ctx.fillText(wtd.name+' WINS!',W/2,H*.49);
  ctx.font='18px Arial';ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillText('★  '+wtd.player+' is the MVP!  ★',W/2,H*.56);
  const p=.68+.32*Math.sin(tick*.07);
  ctx.save();ctx.globalAlpha=p;
  ctx.fillStyle='rgba(198,16,44,.94)';ctx.fillRect(W/2-180,H*.64,360,62);
  ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.strokeRect(W/2-180,H*.64,360,62);
  ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.fillText('CLICK TO PLAY AGAIN',W/2,H*.64+39);ctx.restore();
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────
function loop(){
  tick++;if(lastActT>0)lastActT--;
  if(state==='team_select')handleSel();
  else if(state==='playing'){
    handleInput();opp.updateAI(player);player.tick();opp.tick();
    if(opp.dead&&!winner){winner='player';state='game_over';}
    if(player.dead&&!winner){winner='opponent';state='game_over';}
  }
  ctx.clearRect(0,0,W,H);
  if(state==='menu')drawMenu();
  else if(state==='team_select')drawTeamSelect();
  else if(state==='playing'){
    ctx.drawImage(buf,0,0);
    player.x<opp.x?(player.draw(),opp.draw()):(opp.draw(),player.draw());
    drawHUD();
  }
  else if(state==='game_over')drawGameOver();
  requestAnimationFrame(loop);
}
loop();
</script>
