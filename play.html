<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Basketball Blitz</title>
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}canvas{display:block;}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W=1280,H=720;
const c=document.getElementById('c'),ctx=c.getContext('2d');
c.width=W;c.height=H;
function resize(){const s=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*s+'px';c.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();

const rgb=(r,g,b,a=1)=>`rgba(${r},${g},${b},${a})`;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

const TEAMS={
  bulls:   {name:'Chicago Bulls',        abbr:'CHI',player:'M. Jordan',   pr:[206,17,65], sc:[255,255,255],no:'23',type:'Power',atk:22,spd:.009,paint:[180,12,50]},
  lakers:  {name:'Los Angeles Lakers',   abbr:'LAL',player:'LeBron James',pr:[85,37,130], sc:[253,185,39], no:'23',type:'Power',atk:20,spd:.010,paint:[70,28,110]},
  warriors:{name:'Golden State Warriors',abbr:'GSW',player:'S. Curry',    pr:[29,66,138], sc:[255,199,44], no:'30',type:'Speed',atk:14,spd:.013,paint:[25,60,130]},
  celtics: {name:'Boston Celtics',       abbr:'BOS',player:'J. Tatum',    pr:[0,122,51],  sc:[255,255,255],no:'0', type:'Power',atk:21,spd:.010,paint:[0,100,40]},
  heat:    {name:'Miami Heat',           abbr:'MIA',player:'J. Butler',   pr:[152,0,46],  sc:[255,162,0],  no:'22',type:'Speed',atk:15,spd:.012,paint:[130,0,38]},
  nets:    {name:'Brooklyn Nets',        abbr:'BKN',player:'K. Durant',   pr:[25,25,25],  sc:[255,255,255],no:'7', type:'Speed',atk:17,spd:.011,paint:[20,20,20]},
};
const ORDER=['bulls','lakers','warriors','celtics','heat','nets'];

// ── PERSPECTIVE (camera at near baseline, looking toward far basket) ──────
// wy=0: far (top of screen, narrow)   wy=1: near (bottom, wide)
const FL_T=252,FL_B=H;
const FAR_L=298,FAR_R=982,NEAR_L=-90,NEAR_R=1370;
function proj(wx,wy){
  const xl=lerp(FAR_L,NEAR_L,wy),xr=lerp(FAR_R,NEAR_R,wy);
  return{x:lerp(xl,xr,wx),y:lerp(FL_T,FL_B,wy),sc:lerp(0.30,1.1,wy)};
}

// ── GAME STATE ────────────────────────────────────────────────────────────
let state='menu',teamSel=0;
let pTd,aiTd,pSpd,aiSpd;
let pWx=0.3,aiWx=0.55;
const P_WY=0.80,AI_WY=0.40;
let pFacing=1,aiFacing=-1,pWalkP=0,aiWalkP=0,pMoving=false,aiMoving=false;
let pSuper=0,pSupAct=0;
let score={p:0,ai:0},quarter=1,clockSec=120,shotClock=24,fouls={p:0,ai:0};
let ballHolder='p'; // 'p','ai','p_shot','ai_shot'
let ball={wx:0.5,wy:P_WY,z:0,vz:0,vwx:0,vwy:0,state:'dribble',dribT:0};
let scoredTimer=0,refArmUp=false,refArmT=0;
let popMsg='',popT=0,foulMsg='',foulT=0;
let aiShootT=90,tick=0,winner='';
const keys={};
document.addEventListener('keydown',e=>{keys[e.code]=true;e.preventDefault();});
document.addEventListener('keyup',  e=>{keys[e.code]=false;});
c.addEventListener('click',()=>{
  if(state==='menu')state='team_select';
  else if(state==='game_over'){state='menu';winner='';}
});

// ── STATIC ARENA ──────────────────────────────────────────────────────────
const buf=document.createElement('canvas');buf.width=W;buf.height=H;
const bc=buf.getContext('2d');

function buildArena(paintRGB){
  bc.clearRect(0,0,W,H);

  // Ceiling + spotlight beams
  const cg=bc.createLinearGradient(0,0,0,FL_T);
  cg.addColorStop(0,'#010108');cg.addColorStop(.65,'#0c0820');cg.addColorStop(1,'#181032');
  bc.fillStyle=cg;bc.fillRect(0,0,W,FL_T+20);
  bc.save();bc.globalAlpha=.065;
  for(let i=0;i<9;i++){const lx=65+i*145,lg=bc.createLinearGradient(lx,0,lx,FL_T);lg.addColorStop(0,'rgba(255,235,160,1)');lg.addColorStop(1,'rgba(255,235,160,0)');bc.fillStyle=lg;bc.beginPath();bc.moveTo(lx,0);bc.lineTo(lx-120,FL_T);bc.lineTo(lx+120,FL_T);bc.closePath();bc.fill();}
  bc.restore();

  // Crowd helpers
  const shirts=['#cc2020','#2030cc','#208820','#c8a400','#c04020','#6418cc','#18c8c8','#cc18cc','#888','#dde','#c84418'];
  const skins=['#d4a870','#a06030','#c89060','#805028','#e8c098','#6a3818'];
  function crowd(x0,x1,y,step,sz){
    for(let x=x0;x<x1;x+=step){
      const jx=x+Math.sin(x*.4+y*.3)*2.5,jy=y+Math.cos(x*.5+y*.22)*2;
      bc.fillStyle=shirts[(Math.floor(x*.11)+Math.floor(y*.07))%shirts.length];
      bc.beginPath();bc.ellipse(jx,jy,sz*.42,sz*.62,0,0,Math.PI*2);bc.fill();
      bc.fillStyle=skins[(Math.floor(x*.09)+Math.floor(y*.05))%skins.length];
      bc.beginPath();bc.arc(jx,jy-sz*.57,sz*.25,0,Math.PI*2);bc.fill();
    }
  }

  // Far crowd (behind far basket)
  const fsg=bc.createLinearGradient(0,10,0,FL_T);fsg.addColorStop(0,'#090718');fsg.addColorStop(1,'#120e26');
  bc.fillStyle=fsg;bc.fillRect(0,0,W,FL_T);
  for(let r=0;r<13;r++)crowd(30,W-30,14+r*18,10+r*1.4,9-r*.35);

  // Left side stand
  bc.save();bc.beginPath();bc.moveTo(FAR_L,FL_T);bc.lineTo(0,FL_T);bc.lineTo(0,FL_B);bc.lineTo(NEAR_L+95,FL_B);bc.closePath();bc.clip();
  const lsg=bc.createLinearGradient(0,FL_T,0,FL_B);lsg.addColorStop(0,'#0e0c1e');lsg.addColorStop(1,'#181428');
  bc.fillStyle=lsg;bc.fillRect(0,FL_T,FAR_L,FL_B-FL_T);
  for(let r=0;r<9;r++)crowd(0,FAR_L-r*22+30,FL_T+20+r*42,13,10+r*.4);bc.restore();

  // Right side stand
  bc.save();bc.beginPath();bc.moveTo(FAR_R,FL_T);bc.lineTo(W,FL_T);bc.lineTo(W,FL_B);bc.lineTo(NEAR_R-95,FL_B);bc.closePath();bc.clip();
  const rsg=bc.createLinearGradient(0,FL_T,0,FL_B);rsg.addColorStop(0,'#0e0c1e');rsg.addColorStop(1,'#181428');
  bc.fillStyle=rsg;bc.fillRect(FAR_R,FL_T,W-FAR_R,FL_B-FL_T);
  for(let r=0;r<9;r++)crowd(FAR_R+r*22-30,W,FL_T+20+r*42,13,10+r*.4);bc.restore();

  // Scoreboard (suspended from ceiling)
  const sbW=282,sbH=90,sbX=W/2-141,sbY=10;
  bc.strokeStyle='#3a3a50';bc.lineWidth=2.5;
  bc.beginPath();bc.moveTo(sbX+62,0);bc.lineTo(sbX+62,sbY);bc.stroke();
  bc.beginPath();bc.moveTo(sbX+sbW-62,0);bc.lineTo(sbX+sbW-62,sbY);bc.stroke();
  bc.fillStyle='#04030f';bc.fillRect(sbX,sbY,sbW,sbH);
  bc.strokeStyle='rgba(255,215,0,.55)';bc.lineWidth=2;bc.strokeRect(sbX,sbY,sbW,sbH);
  bc.strokeStyle='rgba(255,215,0,.2)';bc.lineWidth=1;bc.strokeRect(sbX+4,sbY+4,sbW-8,sbH-8);
  bc.fillStyle='#aa0018';bc.fillRect(sbX,sbY,sbW,20);
  bc.fillStyle='#fff';bc.font='bold 12px Arial';bc.textAlign='center';bc.fillText('NBA  BASKETBALL  BLITZ',W/2,sbY+14);

  // Court floor (light maple)
  const fg=bc.createLinearGradient(0,FL_T,0,FL_B);
  fg.addColorStop(0,'#dac884');fg.addColorStop(.22,'#ecdaa0');fg.addColorStop(.55,'#f5ebb8');fg.addColorStop(.8,'#f0e4ae');fg.addColorStop(1,'#e6d892');
  bc.fillStyle=fg;
  bc.beginPath();bc.moveTo(FAR_L,FL_T);bc.lineTo(FAR_R,FL_T);bc.lineTo(NEAR_R,FL_B);bc.lineTo(NEAR_L,FL_B);bc.closePath();bc.fill();
  // Wood planks
  bc.save();bc.beginPath();bc.moveTo(FAR_L,FL_T);bc.lineTo(FAR_R,FL_T);bc.lineTo(NEAR_R,FL_B);bc.lineTo(NEAR_L,FL_B);bc.closePath();bc.clip();
  bc.globalAlpha=.042;
  for(let i=0;i<52;i++){const t=i/52,y=lerp(FL_T,FL_B,t),xl=lerp(FAR_L,NEAR_L,t),xr=lerp(FAR_R,NEAR_R,t);bc.fillStyle=i%2===0?'#000':'#fff';bc.fillRect(xl,y,xr-xl,(FL_B-FL_T)/52*.48);}
  bc.restore();

  // Court line helpers
  function pline(x1,y1,x2,y2){const a=proj(x1,y1),b=proj(x2,y2);bc.beginPath();bc.moveTo(a.x,a.y);bc.lineTo(b.x,b.y);bc.stroke();}
  function parc(cx,cy,rx,ry,sa,ea,N=60){bc.beginPath();for(let i=0;i<=N;i++){const a=sa+(ea-sa)*i/N,p=proj(cx+Math.cos(a)*rx,cy+Math.sin(a)*ry);i===0?bc.moveTo(p.x,p.y):bc.lineTo(p.x,p.y);}bc.stroke();}
  function pfill(pts,col){bc.fillStyle=col;bc.beginPath();pts.forEach((p,i)=>{const q=proj(p[0],p[1]);i===0?bc.moveTo(q.x,q.y):bc.lineTo(q.x,q.y);});bc.closePath();bc.fill();}

  // Paint zones (team color)
  const [r0,g0,b0]=paintRGB;
  pfill([[.31,0],[.69,0],[.69,.25],[.31,.25]],rgb(r0,g0,b0,.82)); // far key
  pfill([[.31,.75],[.69,.75],[.69,1],[.31,1]],rgb(r0,g0,b0,.82)); // near key

  bc.strokeStyle='rgba(255,255,255,.9)';bc.lineWidth=2.5;
  // Outline
  bc.beginPath();bc.moveTo(FAR_L,FL_T);bc.lineTo(FAR_R,FL_T);bc.lineTo(NEAR_R,FL_B);bc.lineTo(NEAR_L,FL_B);bc.closePath();bc.stroke();
  pline(0,.5,1,.5);                        // center line
  pline(.31,0,.31,.25);pline(.69,0,.69,.25);pline(.31,.25,.69,.25); // far paint
  pline(.31,.75,.31,1);pline(.69,.75,.69,1);pline(.31,.75,.69,.75); // near paint
  bc.lineWidth=3;
  parc(.5,.06,.34,.24,-Math.PI/2,Math.PI/2);    // far 3pt arc
  parc(.5,.94,.34,.24,Math.PI/2,Math.PI*1.5);   // near 3pt arc
  bc.lineWidth=2.5;
  parc(.5,.5,.085,.12,0,Math.PI*2);             // center circle
  parc(.5,.24,.185,.13,-Math.PI/2,Math.PI/2);   // far free throw arc
  parc(.5,.76,.185,.13,Math.PI/2,Math.PI*1.5);  // near free throw arc
  bc.lineWidth=2;
  parc(.5,.055,.06,.04,0,Math.PI);              // far restricted
  parc(.5,.945,.06,.04,0,Math.PI);              // near restricted

  // Far basket
  const fb=proj(.5,.01);
  drawBasket(bc,fb.x,fb.y,fb.sc*1.1,1);
  // Near basket (partially at bottom edge)
  const nb=proj(.5,.99);
  drawBasket(bc,nb.x,nb.y,nb.sc*1.0,-1);
}

function drawBasket(c2,x,y,s,dir){
  // Stanchion pole
  c2.fillStyle='#4c4c60';c2.fillRect(x-3*s,y+(dir>0?-8*s:0),5*s,55*s*(dir>0?1:-1));
  // Backboard
  const bbY=y-52*s*dir;
  c2.fillStyle='rgba(195,220,255,.88)';c2.fillRect(x-30*s,bbY,60*s,38*s);
  c2.strokeStyle='rgba(210,230,255,.95)';c2.lineWidth=2*s;c2.strokeRect(x-30*s,bbY,60*s,38*s);
  c2.strokeStyle='#ff4444';c2.lineWidth=1.8*s;c2.strokeRect(x-14*s,bbY+8*s,28*s,20*s);
  // Rim arm
  const rimArm=dir>0?1:-1;
  const armEndX=x+28*s*rimArm,rimY=bbY+(dir>0?32*s:-4*s);
  c2.strokeStyle='#777';c2.lineWidth=3*s;c2.beginPath();c2.moveTo(x,rimY);c2.lineTo(armEndX,rimY);c2.stroke();
  // Rim
  c2.strokeStyle='#e06808';c2.lineWidth=4.5*s;c2.beginPath();c2.ellipse(armEndX,rimY,24*s,7*s,0,0,Math.PI*2);c2.stroke();
  // Net
  c2.strokeStyle='rgba(245,245,245,.65)';c2.lineWidth=1.2*s;
  const netBottom=rimY+26*s*dir;
  for(let i=0;i<9;i++){const a=i/8*Math.PI*2;c2.beginPath();c2.moveTo(armEndX+Math.cos(a)*24*s,rimY+Math.sin(a)*7*s);c2.lineTo(armEndX+Math.cos(a)*14*s,netBottom);c2.stroke();}
  c2.beginPath();c2.ellipse(armEndX,rimY+18*s*dir,18*s,5*s,0,0,Math.PI*2);c2.stroke();
  c2.beginPath();c2.ellipse(armEndX,netBottom,11*s,3*s,0,0,Math.PI*2);c2.stroke();
  // NBA logo on backboard
  c2.fillStyle='rgba(198,16,44,.9)';c2.fillRect(x-6*s,bbY+16*s,12*s,10*s);
  c2.fillStyle='rgba(29,66,138,.9)';c2.fillRect(x-6*s,bbY+14*s,6*s,12*s);
}

buildArena([30,70,150]);

// ── PLAYER SPRITE ─────────────────────────────────────────────────────────
function drawPlayer(x,y,s,td,facing,flash,supAct,wk){
  const[pr,pg,pb]=td.pr,[sr,sg,sb]=td.sc;
  const[jr,jg,jb]=flash?[255,50,50]:[pr,pg,pb];
  const ws=Math.sin(wk*Math.PI*2)*8*s;
  const HR=15*s,SW=24*s,HW=16*s,AW=10*s,AH=28*s,TORSO=34*s,SHORT=22*s,SHIN=26*s,FOOT=7*s;
  const shouldY=y-SHIN-SHORT-TORSO,hipY=y-SHIN-SHORT,kneeY=y-SHIN,headY=shouldY-HR*2-3*s;

  if(supAct>0){ctx.save();ctx.globalAlpha=.18+.1*Math.sin(tick*.12);const ag=ctx.createRadialGradient(x,y-60*s,5,x,y-60*s,70*s);ag.addColorStop(0,'rgba(0,255,180,.7)');ag.addColorStop(1,'rgba(0,255,180,0)');ctx.fillStyle=ag;ctx.fillRect(x-90*s,y-130*s,180*s,145*s);ctx.restore();}

  // Shadow
  ctx.save();ctx.globalAlpha=.2;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(x,y+5*s,SW*1.5,6*s,0,0,Math.PI*2);ctx.fill();ctx.restore();

  // Back arm
  const bax=facing>0?x-SW+4*s:x+SW-4*s;
  ctx.save();ctx.translate(bax,shouldY+5*s);ctx.rotate(facing>0?.5+ws*.02:-.5-ws*.02);
  ctx.fillStyle=rgb(jr,jg,jb);ctx.fillRect(-AW/2,0,AW,AH*.45);ctx.fillStyle='#c09060';ctx.fillRect(-AW/2+s,AH*.43,AW-2*s,AH*.57);ctx.restore();

  // Left leg
  ctx.fillStyle=rgb(Math.max(0,jr-60),Math.max(0,jg-60),Math.max(0,jb-60));ctx.fillRect(x-HW*.9,hipY+ws,HW*.9,SHORT+3*s);
  ctx.fillStyle='#c09060';ctx.fillRect(x-HW*.8,kneeY+ws,9*s,SHIN);
  ctx.fillStyle=rgb(sr,sg,sb);ctx.fillRect(x-HW*.8-3*s,y+ws,20*s,FOOT);
  ctx.fillStyle='#fff';ctx.fillRect(x-HW*.8-3*s,y+ws,20*s,2.5*s);
  // Right leg
  ctx.fillStyle=rgb(Math.max(0,jr-60),Math.max(0,jg-60),Math.max(0,jb-60));ctx.fillRect(x+HW*.1,hipY-ws+5*s,HW*.9,SHORT+3*s);
  ctx.fillStyle='#c09060';ctx.fillRect(x+HW*.2,kneeY-ws+5*s,9*s,SHIN);
  ctx.fillStyle=rgb(sr,sg,sb);ctx.fillRect(x+HW*.2-2*s,y-ws+4*s,20*s,FOOT);
  ctx.fillStyle='#fff';ctx.fillRect(x+HW*.2-2*s,y-ws+4*s,20*s,2.5*s);

  // Jersey body
  ctx.fillStyle=rgb(jr,jg,jb);
  ctx.beginPath();ctx.moveTo(x-SW,shouldY+2*s);ctx.lineTo(x+SW,shouldY+2*s);ctx.lineTo(x+HW,hipY);ctx.lineTo(x-HW,hipY);ctx.closePath();ctx.fill();
  ctx.fillStyle=rgb(sr,sg,sb);ctx.fillRect(x-SW+2*s,shouldY+2*s,SW*2-4*s,3.5*s);
  ctx.font=`bold ${Math.round(16*s)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillText(td.no,x+1,shouldY+TORSO*.52);
  ctx.fillStyle=rgb(sr,sg,sb);ctx.fillText(td.no,x,shouldY+TORSO*.52);ctx.textBaseline='alphabetic';
  ctx.strokeStyle=rgb(sr,sg,sb,.6);ctx.lineWidth=1.5*s;
  ctx.beginPath();ctx.moveTo(x-SW,shouldY+2*s);ctx.lineTo(x+SW,shouldY+2*s);ctx.lineTo(x+HW,hipY);ctx.lineTo(x-HW,hipY);ctx.closePath();ctx.stroke();

  // Front arm
  const fax=facing>0?x+SW-4*s:x-SW+4*s;
  ctx.save();ctx.translate(fax,shouldY+5*s);ctx.rotate(facing>0?-.2-ws*.02:.2+ws*.02);
  ctx.fillStyle=rgb(jr,jg,jb);ctx.fillRect(-AW/2,0,AW,AH*.45);ctx.fillStyle='#c09060';ctx.fillRect(-AW/2+s,AH*.43,AW-2*s,AH*.57);ctx.restore();

  // Head
  ctx.fillStyle='#c09060';ctx.beginPath();ctx.arc(x,headY+HR,HR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#180a00';ctx.beginPath();ctx.arc(x,headY+HR,HR,Math.PI,Math.PI*2);ctx.fill();
  const ex=facing>0?x+HR*.5:x-HR*.5;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,headY+HR*1.3,3*s,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a0800';ctx.beginPath();ctx.arc(ex+facing*.7*s,headY+HR*1.3,1.5*s,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=rgb(sr,sg,sb);ctx.lineWidth=3.5*s;ctx.beginPath();ctx.arc(x,headY+HR,HR+s,Math.PI,Math.PI*2);ctx.stroke();
  ctx.fillStyle=rgb(Math.max(0,pr-42),Math.max(0,pg-42),Math.max(0,pb-42));
  ctx.beginPath();ctx.ellipse(x,headY+HR*.45,HR*1.12,HR*.52,0,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillStyle=rgb(Math.max(0,pr-68),Math.max(0,pg-68),Math.max(0,pb-68));
  ctx.beginPath();ctx.ellipse(x+facing*(HR+9*s),headY+HR*1.15,HR*.52,4*s,0,0,Math.PI*2);ctx.fill();
}

// ── REFEREE SPRITE ────────────────────────────────────────────────────────
function drawRef(x,y,s,armUp){
  const HR=13*s,SW=21*s,HW=13*s,AW=9*s,AH=25*s,TORSO=30*s,SHORT=18*s,SHIN=22*s,FOOT=6*s;
  const shouldY=y-SHIN-SHORT-TORSO,hipY=y-SHIN-SHORT,kneeY=y-SHIN,headY=shouldY-HR*2-2*s;

  ctx.save();ctx.globalAlpha=.15;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(x,y+4*s,SW*1.4,5*s,0,0,Math.PI*2);ctx.fill();ctx.restore();

  // Legs (black)
  ctx.fillStyle='#111';ctx.fillRect(x-HW*.85,hipY,HW*.85,SHORT+SHIN+3*s);ctx.fillRect(x+HW*.1,hipY+4*s,HW*.85,SHORT+SHIN);
  ctx.fillStyle='#222';ctx.fillRect(x-HW*.8-2*s,y,18*s,FOOT);ctx.fillRect(x+HW*.15-2*s,y+3*s,18*s,FOOT);

  // Striped jersey
  ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(x-SW,shouldY+2*s);ctx.lineTo(x+SW,shouldY+2*s);ctx.lineTo(x+HW,hipY);ctx.lineTo(x-HW,hipY);ctx.closePath();ctx.fill();
  ctx.fillStyle='#111';
  for(let i=0;i<4;i++){const sy2=shouldY+2*s+i*(TORSO/4);if(i%2===0){ctx.fillRect(x-SW+i*s*.4,sy2,SW*2-i*s*.8,TORSO/4);}}

  // Arms (ref raises one arm for foul)
  ctx.save();ctx.translate(x+SW-4*s,shouldY+5*s);ctx.rotate(armUp?-Math.PI*.55:-.2);
  ctx.fillStyle='#eee';ctx.fillRect(-AW/2,0,AW,AH*.44);ctx.fillStyle='#c09060';ctx.fillRect(-AW/2,AH*.42,AW,AH*.56);ctx.restore();
  ctx.save();ctx.translate(x-SW+4*s,shouldY+5*s);ctx.rotate(armUp?Math.PI*.35:.2);
  ctx.fillStyle='#eee';ctx.fillRect(-AW/2,0,AW,AH*.44);ctx.fillStyle='#c09060';ctx.fillRect(-AW/2,AH*.42,AW,AH*.56);ctx.restore();

  // Head
  ctx.fillStyle='#c09060';ctx.beginPath();ctx.arc(x,headY+HR,HR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#333';ctx.beginPath();ctx.arc(x,headY+HR,HR,Math.PI,Math.PI*2);ctx.fill();
  if(armUp){ctx.fillStyle='#f0c000';ctx.beginPath();ctx.arc(x+14*s,headY+HR+5*s,4*s,0,Math.PI*2);ctx.fill();}
}

// ── BALL ─────────────────────────────────────────────────────────────────
function updateBall(){
  ball.dribT+=.13;
  if(ball.state==='dribble'){
    ball.wx=ballHolder==='p'?pWx:aiWx;
    ball.wy=ballHolder==='p'?P_WY:AI_WY;
    ball.z=Math.max(0,Math.sin(ball.dribT)*18+3);
  }else if(ball.state==='shot'){
    ball.wx+=ball.vwx;ball.wy+=ball.vwy;ball.z+=ball.vz;ball.vz-=.85;
    // Check score
    if(ball.wy<=0.05&&Math.abs(ball.wx-.5)<0.14){
      const byMe=ballHolder==='p_shot';
      if(byMe)score.p+=2;else score.ai+=2;
      popMsg=byMe?'SCORE! +2 pts':'AI SCORES! +2';popT=90;
      ball.state='scored';scoredTimer=45;
    }
    // Out of bounds / overshot
    if(ball.wy<-0.08||ball.wx<-0.08||ball.wx>1.08||(ball.z<0&&ball.wy>0.1)){
      ball.z=0;ball.state='dribble';
      const prev=ballHolder;ballHolder=prev==='p_shot'?'ai':'p';
      ball.state='dribble';shotClock=24;
    }
    // Block by AI (if p shot and AI near ball path)
    if(ballHolder==='p_shot'){
      const aiPx=proj(aiWx,AI_WY).x,bPx=proj(ball.wx,ball.wy).x,bPy=proj(ball.wx,ball.wy).y;
      const aiPy=proj(aiWx,AI_WY).y;
      if(Math.abs(bPx-aiPx)<55&&Math.abs(bPy-aiPy)<60&&ball.z<60){popMsg='BLOCKED!';popT=60;ball.state='dribble';ballHolder='ai';shotClock=24;}
    }
  }else if(ball.state==='scored'){
    ball.z+=4.5;
    if(scoredTimer>0){scoredTimer--;if(scoredTimer===0){const byMe=ballHolder==='p_shot';ballHolder=byMe?'ai':'p';ball.state='dribble';ball.z=0;shotClock=24;if(quarter>4)endGame();}}
  }
}

function shootBall(who,power=false){
  ballHolder=who==='p'?'p_shot':'ai_shot';
  ball.state='shot';
  const steps=power?52:68;
  ball.vwx=(.5-ball.wx)/steps;
  ball.vwy=(0-ball.wy)/steps;
  ball.vz=power?20:15;
  shotClock=24;
}

function drawBall(){
  const p=proj(ball.wx,ball.wy);
  const s=p.sc,r=13*s,bx=p.x,by=p.y-ball.z*s;
  ctx.save();ctx.globalAlpha=.22;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(p.x,p.y+2,r*1.1,4*s,0,0,Math.PI*2);ctx.fill();ctx.restore();
  const bg=ctx.createRadialGradient(bx-r*.35,by-r*.35,r*.08,bx,by,r);
  bg.addColorStop(0,'#ff8828');bg.addColorStop(.5,'#e05c08');bg.addColorStop(1,'#a03200');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bx,by,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.65)';ctx.lineWidth=1.5*s;
  ctx.beginPath();ctx.arc(bx,by,r,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(bx-r,by);ctx.lineTo(bx+r,by);ctx.stroke();
  ctx.beginPath();ctx.arc(bx,by,r,-Math.PI*.65,Math.PI*.65);ctx.stroke();
  ctx.beginPath();ctx.arc(bx,by,r,Math.PI-.65,Math.PI+.65);ctx.stroke();
}

// ── AI LOGIC ──────────────────────────────────────────────────────────────
function updateAI(){
  if(ballHolder==='p'||ballHolder==='p_shot'){
    const diff=ball.wx-aiWx;
    if(Math.abs(diff)>.01){aiWx=clamp(aiWx+Math.sign(diff)*aiSpd*.9,0.05,.95);aiFacing=Math.sign(diff)>0?1:-1;aiMoving=true;}else aiMoving=false;
    aiWalkP=(aiWalkP+.06)%1;
    // Steal attempt
    if(ballHolder==='p'&&Math.abs(aiWx-pWx)<0.09&&Math.random()<.006){
      if(fouls.ai>=5){// Too many fouls - cautious
      }else if(Math.random()<.4){
        fouls.ai++;
        if(fouls.ai%3===0){foulMsg='FOUL on AI!';foulT=90;score.p+=1;popMsg=pTd.player+' gets free throw! +1';popT=80;refArmUp=true;refArmT=90;ballHolder='p';}
        else{popMsg='STEAL!';popT=55;ballHolder='ai';aiShootT=70+Math.random()*50;}
      }else{popMsg='STEAL!';popT=55;ballHolder='ai';aiShootT=70+Math.random()*50;}
    }
  }else if(ballHolder==='ai'||ballHolder==='ai_shot'){
    if(ball.state==='dribble'){
      aiShootT--;aiMoving=Math.random()<.35;
      if(aiMoving){const d=Math.random()<.5?1:-1;aiWx=clamp(aiWx+d*aiSpd,0.05,.95);aiFacing=d;}
      if(aiShootT<=0){shootBall('ai');}
    }
  }
  if(refArmT>0){refArmT--;if(refArmT<=0)refArmUp=false;}
}

function endGame(){if(quarter>4){state='game_over';winner=score.p>score.ai?'p':'ai';}}

// ── INPUT ─────────────────────────────────────────────────────────────────
function handleInput(){
  let dx=0;
  if(keys['ArrowLeft']||keys['KeyA'])dx=-1;
  if(keys['ArrowRight']||keys['KeyD'])dx=1;
  pMoving=!!dx;
  if(dx){pFacing=dx;pWx=clamp(pWx+dx*pSpd,0.05,.95);}
  if(pMoving)pWalkP=(pWalkP+.07)%1;

  if(keys['Space']){
    keys['Space']=false;
    if(ballHolder==='p'&&ball.state==='dribble'){
      shootBall('p');popMsg='SHOOT!';popT=35;
    }else if(ballHolder==='ai'&&ball.state==='dribble'&&Math.abs(pWx-aiWx)<0.1){
      // Steal attempt
      if(Math.random()<.45){popMsg='STEAL!';popT=55;ballHolder='p';}
      else if(Math.random()<.5){fouls.p++;foulMsg='FOUL on YOU!';foulT=90;score.ai+=1;popMsg='AI gets free throw! +1';popT=80;refArmUp=true;refArmT=90;}
    }
  }
  if((keys['ShiftLeft']||keys['ShiftRight'])&&pMoving){
    pWx=clamp(pWx+pFacing*.07,.05,.95);keys['ShiftLeft']=keys['ShiftRight']=false;
  }
  if(keys['KeyE']&&pSuper>=100){
    pSuper=0;pSupAct=180;
    if(ballHolder==='p'){shootBall('p',true);popMsg='★ POWER SHOT! ★';popT=90;}
    else if(Math.abs(pWx-aiWx)<.15){popMsg='SUPERSTAR STEAL!';popT=70;ballHolder='p';}
    keys['KeyE']=false;
  }
}
function handleSel(){
  if(keys['ArrowRight']){teamSel=(teamSel+1)%6;keys['ArrowRight']=false;}
  if(keys['ArrowLeft']) {teamSel=(teamSel+5)%6;keys['ArrowLeft']=false;}
  if(keys['ArrowDown']||keys['ArrowUp']){teamSel=(teamSel+3)%6;keys['ArrowDown']=keys['ArrowUp']=false;}
  if(keys['Enter']||keys['Space']){
    const mk=ORDER[teamSel],ok=ORDER.filter(k=>k!==mk)[Math.floor(Math.random()*5)];
    pTd=TEAMS[mk];aiTd=TEAMS[ok];
    pSpd=pTd.spd;aiSpd=aiTd.spd;
    pWx=.3;aiWx=.55;pFacing=1;aiFacing=-1;
    score={p:0,ai:0};quarter=1;clockSec=120;shotClock=24;fouls={p:0,ai:0};
    pSuper=0;pSupAct=0;popMsg='';popT=0;foulMsg='';foulT=0;
    buildArena(pTd.paint);
    ballHolder='p';ball.state='dribble';ball.z=0;aiShootT=90;
    state='playing';keys['Enter']=keys['Space']=false;
  }
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────
function loop(){
  tick++;
  if(popT>0)popT--;if(foulT>0)foulT--;

  if(state==='team_select')handleSel();
  else if(state==='playing'){
    handleInput();updateBall();updateAI();
    if(pSupAct>0)pSupAct--;
    pSuper=Math.min(100,pSuper+(pMoving?.14:.04));
    if(ball.state!=='scored'){
      clockSec-=1/60;shotClock-=1/60;
      if(shotClock<=0){shotClock=24;const ph=ballHolder==='p'||ballHolder==='p_shot';ballHolder=ph?'ai':'p';ball.state='dribble';ball.z=0;popMsg='SHOT CLOCK!';popT=60;aiShootT=80;}
      if(clockSec<=0){quarter++;if(quarter>4)endGame();else{clockSec=120;shotClock=24;ballHolder='p';ball.state='dribble';ball.z=0;}}
    }
  }

  ctx.clearRect(0,0,W,H);
  if(state==='menu'){drawMenu();return requestAnimationFrame(loop);}
  if(state==='team_select'){drawTeamSelect();return requestAnimationFrame(loop);}
  if(state==='game_over'){drawGameOver();return requestAnimationFrame(loop);}

  // ── PLAYING ──
  ctx.drawImage(buf,0,0);

  // Draw order: far things first (AI, ref far), then ball, then player (near = in front)
  const aiP=proj(aiWx,AI_WY);
  const pP=proj(pWx,P_WY);
  const refP=proj(.03,.58);

  // Ref (left sideline)
  drawRef(refP.x+refP.sc*18,refP.y,refP.sc,refArmUp);

  // AI player (far, smaller)
  drawPlayer(aiP.x,aiP.y,aiP.sc,aiTd,aiFacing,false,0,aiMoving?aiWalkP:0);
  // Name label above AI
  ctx.font=`bold ${Math.round(12*aiP.sc)}px Arial`;ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(aiP.x-44,aiP.y-130*aiP.sc,88,16);
  ctx.fillStyle=rgb(...aiTd.sc);ctx.fillText('★ '+aiTd.player,aiP.x,aiP.y-118*aiP.sc);

  // Ball
  drawBall();

  // Player (near, larger — drawn last so appears in front)
  drawPlayer(pP.x,pP.y,pP.sc,pTd,pFacing,false,pSupAct,pMoving?pWalkP:0);
  // Name label above player
  ctx.font=`bold ${Math.round(13*pP.sc)}px Arial`;ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.82)';ctx.fillRect(pP.x-50,pP.y-158*pP.sc,100,18);
  ctx.fillStyle=rgb(...pTd.sc);ctx.fillText('★ '+pTd.player,pP.x,pP.y-143*pP.sc);

  drawScoreboard();
  drawHUD();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
